# This repository runs its own change control. One maintainer, so the solo profile applies:
# self-approval is recorded as waived_solo, with a cool-off on major.
aidd_version = "1.0.0"
profile = "solo"
scope_exempt_paths = ["CHANGELOG.md"]
# The gate's own code, its data, the CI it ships, and the plugins that run on users'
# machines: changing any of them is major, with a cool-off under solo. So are the files that
# install and release aidd and the policies it publishes (the installer, the package manifest,
# the security, governance, release, and review policies): the baseline leaves those to each
# adopter, since every project has its own.
protected_paths = [
  "src/**", "schemas/**", "templates/**", "evals/**", ".claude-plugin/**", "hooks/**", "plugins/**", "docs/**",
  "install.sh", "pyproject.toml", "SECURITY.md", ".github/SECURITY.md", "GOVERNANCE.md", "RELEASING.md", "REVIEW.md",
]
budget_exclude_paths = ["tests/jsonschema_suite/**"]
goal = "Every change an agent writes can be trusted to merge: the right thing, proven, and approved by a person."

[owners]
default_team = "maintainers"
approvers = ["@thaithienvanid"]

# The suite also checks generated docs, the examples, and the repository (tests/test_cli.py).
[[tests]]
name = "unit"
command = ["python3", "-m", "unittest", "discover", "-s", "tests"]
timeout_seconds = 900

# Dependabot's routine bumps of the dev and CI tooling merge on green tests without a person: only the manifests it
# writes outside protected paths. Its Actions bumps (.github/workflows/, action.yml) and a pyproject.toml bump touch
# protected paths, so they stay major and need an approval; so does a Claude Code CLI bump, which needs a human edit to
# templates/github/aidd-diagnose.yml before the tests pass. The limit fits one grouped monthly lockfile bump (a
# major Mermaid and jsdom bump changed about 920 lines of tools/mermaid/package-lock.json).
[[standard_changes]]
name = "dependabot-tooling"
paths = ["tools/mermaid/package.json", "tools/mermaid/package-lock.json", ".github/requirements/**"]
authors = ["dependabot[bot]"]
max_changed_lines = 1200
type = "deps"
dimensions = ["third_party"]
update_types = ["patch", "minor"]   # a major bump of a tool takes a normal change: its API or output may change

[identities]
system_accounts = ["web-flow"]
bots = ["claude[bot]"]
