# aidd: central test workflow, for an organization required workflow.
#
# PREREQUISITE: the `attest` job uses actions/attest-build-provenance, which GitHub offers for
# public repositories on any plan, and for private or internal repositories only on Enterprise
# Cloud. On a private repository without it the job fails, no aidd-evidence artifact is uploaded,
# and aidd/gate stays pending on every pull request. Delete the `attest` job and the
# `evidence.signer_workflow` config key if that is your plan. A fork's pull request also cannot be
# granted id-token and attestations write, so it will not attest.
#
# Keep this file in a platform repository that only the platform team can change,
# and require it on the repositories you gate (organization ruleset → "Require
# workflows to pass before merging"). A pull request then cannot change how its
# tests run, because this definition does not live in its repository.
#
# Each gated repository sets, in .aidd/config.toml:
#   [evidence]
#   signer_workflow = "<org>/<platform-repo>/.github/workflows/aidd-tests.yml"
# and the gate accepts evidence only with an attestation this workflow signed.
#
# What this closes: evidence from any other workflow, and edits to the test
# workflow itself. What it cannot close: the first job runs the pull request's
# code, which can still make its own tests lie. The Spec approval and Merge approval reviews cover that.
name: aidd-tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read  # in a merge queue: the queued pull request's description, which names its Spec

jobs:
  tests:
    if: github.event.action != 'edited' || github.event.changes.body != null
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aidd-tests-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Install the repository's toolchain here (a shared setup action per stack works well).

      # aidd-pin: `aidd init` rewrites this ref to the release commit SHA; pin by SHA if you copy the file by hand.
      - uses: thaithienvanid/aidd@v1.0.0
        with:
          artifact: aidd-evidence-raw

  # Runs no pull request code: it only signs the file the first job produced.
  attest:
    needs: tests
    if: always() && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read       # the default read; this job checks out no code
      id-token: write      # sign the evidence with this workflow's OIDC identity
      attestations: write  # store the attestation the gate checks against evidence.signer_workflow
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aidd-evidence-raw
          path: evidence
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidd-evidence
          path: evidence/evidence.json
          retention-days: 90
