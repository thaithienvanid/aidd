<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 546" width="680" height="546" role="img" aria-labelledby="t d">
<title id="t">aidd's loop: six stages, where agents do the steps and you decide at four gates</title>
<desc id="d">Proven at every step. You decide the risky steps. Agents do the steps, and you decide at the gates. Every change runs one loop of six stages. Plan holds the Plan step and ends at the Intent agreement gate. Design holds Specify and ends at the Spec approval gate. Build holds Implement. Test holds Verify and Review and ends at the Merge approval gate. Deploy holds Merge, then the Production release gate, then Roll out. Maintain holds Learn, and a lesson becomes a new change, back at Plan. Below the loop, an Intent holds two phases, and each phase holds slices. The slice being worked on has its own Spec. The Intent stands in Plan, and the Spec stands in each stage from Design on.</desc>
