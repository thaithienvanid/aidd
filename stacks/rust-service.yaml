# A stack: opinionated standards that go together, plus the `project.stack` entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
name: rust-service
description: "An HTTP service in Rust."
standards:
  - rust/msrv
  - rust/cargo-lockfile
  - rust/rustfmt
  - rust/clippy
  - rust/cargo-nextest
  - rust/cargo-deny
  - rust/axum
  - rust/sqlx
  - rust/cargo-workspace
  - rust/cargo-workspace-boundaries
  - rust/criterion
  - tooling/hurl
  - tooling/k6
reviewed: "2026-10-22"
project:
  stack:
    adopt: [Rust, Cargo, cargo-nextest, cargo-deny, axum, tokio, SQLx, Criterion.rs, Hurl, k6]
