name: python-api
description: "An HTTP API in Python with a SQL database."
extends: python-cli
standards:
  - python/pytest-tests
  - python/python-version
  - python/fastapi-api
  - python/pydantic-validation
  - python/sqlalchemy-orm
  - python/alembic-migrations
  - python/uv-workspace
  - python/import-linter
  - python/pytest-benchmark
  - tooling/hurl
  - tooling/locust
reviewed: "2026-10-22"
project:
  stack:
    adopt: [pytest, FastAPI, Pydantic, SQLAlchemy, Alembic, Import Linter, pytest-benchmark, Hurl, Locust]
