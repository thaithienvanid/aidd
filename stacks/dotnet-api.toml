# A stack: opinionated standards that go together, plus the [project.stack] entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
name = "dotnet-api"
description = "A .NET HTTP API on ASP.NET Core minimal APIs: the .NET LTS, Central Package Management, dotnet format, analyzers, xUnit, EF Core, Testcontainers, one .slnx, and ArchUnitNET."
standards = [
  "dotnet/dotnet-lts",
  "dotnet/central-package-management",
  "dotnet/dotnet-format",
  "dotnet/analyzers-nullable",
  "dotnet/xunit-v3",
  "dotnet/minimal-apis",
  "dotnet/ef-core-migrations",
  "dotnet/ef-core",
  "dotnet/testcontainers",
  "dotnet/slnx-central-packages",
  "dotnet/archunitnet",
]
reviewed = "2026-10-09"
owner = "@thaithienvanid"

[project.stack]
adopt = [".NET", "C#", "ASP.NET Core", "xUnit.net", "Entity Framework Core", "Testcontainers"]
trial = ["ArchUnitNET"]
