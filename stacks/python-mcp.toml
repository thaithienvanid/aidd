# A stack: opinionated standards that go together, plus the [project.stack] entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
name = "python-mcp"
description = "A Python MCP server: the python-cli base plus pytest, a pinned Python, FastMCP, and Pydantic for the tools' input."
extends = "python-cli"
standards = ["python/pytest-tests", "python/python-version", "python/fastmcp-server", "python/pydantic-validation"]
reviewed = "2026-10-07"
owner = "@thaithienvanid"

[project.stack]
adopt = ["pytest", "Pydantic"]
trial = ["FastMCP"]
