# A stack: opinionated standards that go together, plus the [project.stack] entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
name = "rust-service"
description = "A Rust HTTP service: a pinned toolchain with a declared MSRV, a committed Cargo.lock, rustfmt and Clippy, cargo-nextest, cargo-deny, axum on tokio, SQLx, and a Cargo workspace of module crates."
standards = [
  "rust/msrv",
  "rust/cargo-lockfile",
  "rust/rustfmt",
  "rust/clippy",
  "rust/cargo-nextest",
  "rust/cargo-deny",
  "rust/axum",
  "rust/sqlx",
  "rust/cargo-workspace",
  "rust/cargo-workspace-boundaries",
]
reviewed = "2026-10-09"
owner = "@thaithienvanid"

[project.stack]
adopt = ["Rust", "Cargo", "cargo-nextest", "cargo-deny", "axum", "tokio", "SQLx"]
