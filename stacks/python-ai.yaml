# A stack: opinionated standards that go together, plus the `project.stack` entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
# It extends python-cli, not python-api, because a stack extends one other stack, one level deep.
name: python-ai
description: "An AI agent service in Python with an HTTP API, retrieval over PostgreSQL, evals, traces, and durable workflows, for a team that builds its own agent loop."
extends: python-cli
standards:
  - python/pytest-tests
  - python/python-version
  - python/langgraph-agents
  - python/pydantic-validation
  - python/fastapi-api
  - python/sqlalchemy-orm
  - python/alembic-migrations
  - postgres/pgvector
  - python/deepeval-evals
  - ai/langfuse-traces
  - python/temporal-workflows
reviewed: "2026-10-22"
project:
  stack:
    adopt: [pytest, Pydantic, FastAPI, SQLAlchemy, Alembic, PostgreSQL, pgvector, Temporal]
    trial: [LangGraph, DeepEval, Langfuse]
