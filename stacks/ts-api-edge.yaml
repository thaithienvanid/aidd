# A stack: opinionated standards that go together, plus the `project.stack` entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
name: ts-api-edge
description: "A TypeScript API on Cloudflare Workers: the ts-library base plus Hono, Zod at the boundary, Drizzle on D1, Wrangler's forward-only D1 migrations, Turborepo, and dependency-cruiser."
extends: ts-library
standards:
  - typescript/hono-api
  - typescript/zod-validation
  - typescript/drizzle-orm
  - cloudflare/workers-compute
  - cloudflare/d1-or-hyperdrive
  - cloudflare/d1-migrations
  - cloudflare/wrangler
  - typescript/pnpm-turborepo-workspace
  - typescript/dependency-cruiser
reviewed: "2026-10-16"
project:
  stack:
    adopt: [Hono, Zod, Cloudflare Workers, Cloudflare D1, Wrangler, Turborepo, dependency-cruiser]
    trial: [Drizzle ORM]
