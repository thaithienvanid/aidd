# A stack: opinionated standards that go together, plus the `project.stack` entries they bring (schemas/stack.schema.json).
# It holds no rule text. A new stack, or a change to one, is a Spec, not an RFC (CONTRIBUTING.md).
name: c-cmake
description: "A C library or program built with CMake presets and Ninja, tested on the host with Unity, CMock, and Ceedling under sanitizers."
standards:
  - cpp/language-standard
  - cpp/cmake-presets
  - cpp/vcpkg
  - cpp/clang-format
  - cpp/clang-tidy
  - cpp/unity-ceedling
checked: "2026-10-22"
checked_by: agent:claude-code/claude-opus-5-5
project:
  stack:
    adopt: [C17, CMake, Ninja, vcpkg, clang-format, clang-tidy, Unity, CMock, Ceedling, AddressSanitizer, UndefinedBehaviorSanitizer]
