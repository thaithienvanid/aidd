version: 2
# Monthly, each ecosystem in grouped pull requests (one per group below), so a bump costs one review and one CI run a
# month, not one per package. Dependabot security updates, when they are on, ignore this schedule and arrive with the advisory.
updates:
  # Pinned action SHAs in .github/workflows/ and the root action.yml ("/"). Dependabot does not
  # scan templates/github/, so a bump turns CI red through tests/test_version.py until
  # `python3 tools/sync_pins.py` copies the pins into the templates in the same PR.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows"]
    schedule:
      interval: monthly
    # Let a new release age a week before it is proposed, so a compromised release is usually
    # caught and yanked first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The dev extra in pyproject.toml, and the hash-locked CI toolchain, coverage tool, build backend, and SBOM
  # generator in .github/requirements/ (compiled with uv pip compile --generate-hashes).
  # Two groups, by what a bump can reach. release-tools make the wheel and its SBOM: their patch and
  # minor bumps come in one PR, and a major arrives alone. dev-tools are the CI toolchain and the dev
  # extra, and move together at every update type. jsonschema is direct in lint.in and transitive in
  # sbom.txt, so its bump lands in dev-tools and touches sbom.txt too. A person reviews and merges every
  # bump, as any other change; the groups only say what each pull request can reach.
  - package-ecosystem: pip
    directories: ["/", "/.github/requirements"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      release-tools:
        patterns: ["hatchling", "hatch-fancy-pypi-readme", "cyclonedx-*"]
        update-types: ["patch", "minor"]
      dev-tools:
        patterns: ["*"]
        exclude-patterns: ["hatchling", "hatch-fancy-pypi-readme", "cyclonedx-*"]

  # The Node tools CI runs (the Claude Code CLI, Mermaid and jsdom for the diagram check), locked in
  # tools/mermaid/package-lock.json. They live outside .github/, where Dependabot's npm updates could not write
  # ("The request contains invalid or unauthorized changes"). Two groups, by what a bump reaches. node-tools (Mermaid,
  # jsdom) touch only tools/mermaid/ and the diagram check. claude-code-cli comes alone, so a bump of the agent CLI the
  # plugin check and the evals use is its own change for a person to review.
  - package-ecosystem: npm
    directory: "/tools/mermaid"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      node-tools:
        patterns: ["*"]
        exclude-patterns: ["@anthropic-ai/claude-code*"]
      claude-code-cli:
        patterns: ["@anthropic-ai/claude-code*"]

  # axe-core, which the work-items page's accessibility test injects into Chrome, locked in tools/axe/package-lock.json.
  - package-ecosystem: npm
    directory: "/tools/axe"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      axe:
        patterns: ["*"]
