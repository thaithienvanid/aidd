version: 2
# Monthly, each ecosystem in one grouped pull request, so a bump costs one review and one CI run a month, not one
# per package. Dependabot security updates, when they are on, ignore this schedule and arrive with the advisory.
updates:
  # Pinned action SHAs in .github/workflows/ and the root action.yml ("/"). Dependabot does not
  # scan templates/github/, so a bump turns CI red through tests/test_version.py until the
  # matching template pins are updated by hand in the same PR.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows"]
    schedule:
      interval: monthly
    # Let a new release age a week before it is proposed, so a compromised release is usually
    # caught and yanked first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The dev extra in pyproject.toml, and the hash-locked CI toolchain, build backend, and SBOM
  # generator in .github/requirements/ (compiled with uv pip compile --generate-hashes).
  - package-ecosystem: pip
    directories: ["/", "/.github/requirements"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      ci-toolchain:
        patterns: ["*"]

  # The Node tools CI runs (the Claude Code CLI, Mermaid and jsdom for the diagram check), locked in
  # tools/mermaid/package-lock.json. They live outside .github/, where Dependabot's npm updates could not write
  # ("The request contains invalid or unauthorized changes"). A bump of the CLI turns CI red through
  # tests/test_version.py until templates/github/aidd-triage.yml carries the same version and linux-x64 integrity
  # (updated by hand in the same PR).
  - package-ecosystem: npm
    directory: "/tools/mermaid"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      node-tools:
        patterns: ["*"]
