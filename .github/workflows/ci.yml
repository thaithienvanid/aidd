# ci: the same few jobs on a pull request and on a push to main; the Linux matrix weekly, and every OS by hand, which
# the release requires before it publishes. Require the `ci passed` job, whose name is the same whatever runs.
#
# A pull request and a push to main run two jobs and the summary, all on Linux:
#   checks  every static check: the secret scan (gitleaks, over the history and the tree), ruff, mypy, the
#           module boundaries (Import Linter), the generated docs, the conformance examples, `aidd validate`, the
#           stock-validator test, the installer, the plugin manifests, and the Mermaid diagrams; actionlint and zizmor
#           when a workflow, action.yml, or a CI template changed
#   test    the wheel built with the hash-locked backend and installed on 3.11, 3.14, and 3.15, the zipapp on 3.14, and a
#           byte-compile on 3.11 (the oldest supported Python). On a push to main, the schedule, and a manual run it
#           also runs the suite on 3.14 under branch coverage, reported in the job summary, with floors for the guard,
#           the gate, and a person's decisions (tests/coverage_floors.py). A
#           pull request runs the suite once, in aidd-tests (3.14, the runner of record), not here too. It always
#           runs: many tests read Markdown (docs, the skill, the examples), so no change is documentation only
# The weekly schedule adds the rest of the Linux matrix (Python 3.11-3.15), the sdist running its own tests, and the
# installed wheel on Linux. A manual run (Actions, ci, Run workflow) adds macOS and Windows to both; release.yml
# refuses a commit without a successful manual run. macOS and Windows stay off every push and the schedule: in a
# private repository, Windows minutes bill at twice and macOS at ten times the Linux rate, and a weekly run on every
# OS took most of GitHub Free's 2,000 minutes a month. No tag trigger: a tag-triggered run counts as publishing,
# where the caches are unsafe.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * 6"  # the matrix and the rest of ci, weekly: only this cron runs them
    - cron: "23 7 * * 1"  # only the guard-sweep job; checks, test, matrix, build, and wheel skip
    - cron: "41 5 * * 1"  # only the standards and standards-issue jobs; the same five skip
  workflow_dispatch:
    inputs:
      run_guard_sweep:
        description: "Also run the weekly guard sweep"
        type: boolean
        default: false
      per_category:
        description: "Guard sweep: lines per category (base, explore, approvals)"
        type: string
        default: "333"
      run_standards:
        description: "Also run the weekly standards check"
        type: boolean
        default: false
      open_issue:
        description: "Standards check: open an issue (or add to the open one) when a quote moved or went missing"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push cancels the older run on the same pull request or branch. The release checks that ci passed on main
# for the tagged commit: when a newer push cancelled that commit's run, re-run it before tagging (RELEASING.md).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  checks:
    if: (github.event_name != 'schedule' || github.event.schedule == '37 3 * * 6')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the whole history, for the secret scan; on a pull request, HEAD^1 is the base
      # On a pull request, the workflow audits run only when a workflow, action.yml, a CI template, or their
      # config changed; every other check runs whatever changed. Other events audit every time.
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -Eq '^(\.github/workflows/|\.github/zizmor|action\.ya?ml$|templates/github/)'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
            echo "No workflow, action, or CI template changed; actionlint and zizmor are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The secret scan, as the `secrets` job of templates/github/aidd-security.yml runs it: gitleaks from its
      # release, checked against the SHA-256 the release's checksums file lists. Steps here, not a job of their own:
      # a pull request runs the checks and the tests only. .gitleaks.toml keeps the default rules and allows the
      # fake credentials of the guard's redaction tests.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      # On a pull request, the scan takes .gitleaks.toml and .gitleaksignore from the base branch, so the change under
      # scan cannot turn its own scan off. It names the branch by its full ref, which checkout's fetch-depth 0 fetches,
      # so a tag cannot stand in for it; without one there, the default rules and no ignore list. A push or a
      # scheduled run takes them from the checked-out tree. gitleaks reads ./.gitleaksignore whatever
      # --gitleaks-ignore-path names, so the scan removes it first. --ignore-gitleaks-allow ignores inline
      # `gitleaks:allow` comments. --redact keeps a found secret out of the log; --verbose names each finding's
      # file, line, and fingerprint.
      - name: Secret scan of the history and the working tree (gitleaks)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          conf="$RUNNER_TEMP/gitleaks/config.toml"
          ignore="$RUNNER_TEMP/gitleaks/ignore"
          if [ -n "$BASE_REF" ]; then
            git show "refs/remotes/origin/$BASE_REF:.gitleaks.toml" > "$conf" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$conf"
            git show "refs/remotes/origin/$BASE_REF:.gitleaksignore" > "$ignore" 2>/dev/null || : > "$ignore"
          else
            cp .gitleaks.toml "$conf" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$conf"
            cp .gitleaksignore "$ignore" 2>/dev/null || : > "$ignore"
          fi
          rm -f .gitleaksignore
          set -- --config "$conf" --gitleaks-ignore-path "$ignore" --ignore-gitleaks-allow --no-banner --redact --verbose
          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git "$@" . || status=1
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$@" . || status=1
          exit "$status"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # stays on 3.12 with the hash-locked toolchains in .github/requirements/ (runtime jobs use 3.14)
          cache: pip
          cache-dependency-path: .github/requirements/lint.txt
      # Every tool is pinned with hashes in .github/requirements/lint.txt, where Dependabot sees it.
      - name: Install the lint toolchain
        run: |
          python -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/python" -m pip install --quiet --require-hashes --no-deps -r .github/requirements/lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      # actionlint does not know job.workflow_sha and job.workflow_repository yet (GitHub documents both).
      - if: steps.scope.outputs.workflows == 'true'
        run: actionlint -ignore 'property "workflow_(repository|sha)" is not defined' .github/workflows/*.yml templates/github/aidd-*.yml
      # Workflows are audited online (impostor commits, known-vulnerable actions); the adopter templates
      # offline, with their own config: their aidd ref is the placeholder `aidd init` rewrites to a SHA.
      - name: zizmor
        if: steps.scope.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --config .github/zizmor.yml .github/workflows action.yml
          zizmor --offline --config .github/zizmor-templates.yml templates/github/aidd-*.yml
      - run: ruff check src tests plugins/aidd-team/tools
      - run: ruff format --check src tests plugins/aidd-team/tools
      - run: mypy
      # The module boundaries in .importlinter, with Import Linter hash-locked in lint.txt: a new wrong-way import fails
      # here, and tests/test_import_boundaries.py fails when its list of known ones grows.
      - name: Module boundaries (Import Linter)
        env:
          PYTHONPATH: src
          REQUIRE_IMPORT_LINTER: "1"
        run: |
          lint-imports --no-cache
          python -m unittest discover -s tests -p test_import_boundaries.py -v
      # The CLI from the source tree, as AGENTS.md runs it: no install, so no unpinned build backend.
      - name: Generated docs, conformance examples, and this repository's own Specs
        env:
          PYTHONPATH: src
        run: |
          python -m aidd gen-docs --check
          python -m aidd eval examples
          python -m aidd validate
      # The schemas and the materialized conformance corpus, checked with a stock JSON Schema validator
      # (jsonschema, hash-locked in lint.txt); REQUIRE_JSONSCHEMA=1 turns the test's skip into a failure.
      - name: A stock validator resolves the schemas and agrees on the corpus
        env:
          REQUIRE_JSONSCHEMA: "1"
        run: python -m unittest discover -s tests -p test_stock_validator.py -v
      # aidd's YAML subset against a stock YAML reader (PyYAML, hash-locked in lint.txt): every document the subset
      # accepts must read the same in both. REQUIRE_PYYAML=1 turns the test's skip into a failure.
      - name: A stock YAML reader agrees with aidd's YAML subset
        env:
          REQUIRE_PYYAML: "1"
        run: python -m unittest discover -s tests -p test_strict_yaml.py -v
      - run: python -m compileall -q src tests
      - run: sh -n install.sh
      - run: shellcheck install.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/mermaid/package-lock.json
      - name: The Claude Code marketplace and plugins validate
        run: |
          npm ci --prefix tools/mermaid --no-audit --no-fund
          export PATH="$PWD/tools/mermaid/node_modules/.bin:$PATH"
          # Every warning fails, such as an unknown manifest field, but one: no plugin sets `version`, so Claude Code
          # versions each by its commit and `claude plugin update` always brings the latest (docs/INSTALL.md, Versions).
          for target in .claude-plugin/plugin.json . plugins/*/; do
            out=$(claude plugin validate "$target" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            # The counts the validator reports, never its line format: every warning it found must be the version one.
            # One target can validate twice (`.` is the marketplace and the root plugin), so the counts add up.
            found=$(echo "$out" | sed -n 's/.*Found \([0-9][0-9]*\) warning.*/\1/p' | awk '{n += $1} END {print n + 0}')
            versions=$(echo "$out" | grep -c 'No version specified' || true)
            if [ "${found:-0}" != "$versions" ]; then exit 1; fi
          done
          # The mod's own tests, run by Claude Code against the engine it loads in.
          claude plugin test plugins/aidd-mods
      # A Mermaid diagram with a syntax error renders on GitHub as an error box; parse every one with Mermaid itself.
      - name: Every Mermaid diagram parses
        run: node tools/mermaid/check-mermaid.mjs

  # The wheel and the zipapp as users run them, on the oldest and the newest supported Python; off a pull request, the
  # suite with branch coverage too. One job, so a pull request waits on one runner for it; the other Pythons run
  # weekly and the other OSes by hand.
  test:
    if: (github.event_name != 'schedule' || github.event.schedule == '37 3 * * 6')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.14
            3.15
      # A syntax newer than the oldest supported Python fails here, on every pull request, in seconds; the matrix
      # runs the suite on 3.11 weekly.
      - name: Everything compiles on Python 3.11
        run: python3.11 -m compileall -q src tests
      # A pull request runs the suite in aidd-tests; a push to main, the schedule, and a manual run run it here, once,
      # under branch coverage. coverage is hash-locked in .github/requirements/coverage.txt, where Dependabot sees it.
      # tests/run.py runs each test file in its own process, one per core, and coverage combines what each recorded;
      # the matrix below still runs the suite in one process, so both ways stay green.
      # Ubuntu 24.04 stops a program from making the user namespaces Chrome's sandbox needs, unless AppArmor names it.
      # The runner is a throwaway machine, so lift that limit for the run and keep Chrome's own sandbox on.
      - name: Let Chrome make its sandbox
        if: github.event_name != 'pull_request'
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # The viewer's behavior tests drive the Chrome on the runner, headless, against a page served from 127.0.0.1 only.
      - name: The suite on Python 3.14, with branch coverage
        if: github.event_name != 'pull_request'
        env:
          AIDD_BROWSER_TESTS: "1"
        run: |
          python3.14 -m pip install --quiet --require-hashes --no-deps -r .github/requirements/coverage.txt
          python3.14 tests/run.py --coverage
          python3.14 -m coverage combine
      # The newest Python, on every change: its standard library may change what aidd prints (3.15's argparse did).
      - name: The suite on Python 3.15, the newest
        if: github.event_name != 'pull_request'
        env:
          AIDD_BROWSER_TESTS: "1"
        run: python3.15 tests/run.py
      # The numbers go to the job summary; the floors fail the run (they only rise: tests/coverage_floors.py).
      - name: Coverage report
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          python3.14 -m coverage report --skip-covered --sort=cover
          python3.14 -m coverage report --format=markdown --skip-covered --sort=cover >> "$GITHUB_STEP_SUMMARY"
          python3.14 tests/coverage_floors.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.24  # unquoted: tests/test_version.py reads quoted `version:` lines as aidd pins
      # The same hash-locked backend the release uses.
      - run: uv build --wheel --build-constraint .github/requirements/build.txt --require-hashes
      # A wheel built from a tree holding local eval results or node_modules leaves them out, and an installed wheel
      # finds its bundled data inside itself, not in a checkout.
      - name: The wheel leaves ignored local output out and finds its own data
        working-directory: tests
        env:
          BUILD_WHEEL_TEST: "1"
        run: python3.14 -m unittest test_release_surface.WheelContentsTests test_bundled_data
      # CI has no gh login and no git user.email, so init cannot name the operator as the approver: name one, or
      # doctor fails, as it should for a solo profile with nobody to approve.
      - name: The wheel carries schemas, skill, and templates (3.11, 3.14, and 3.15)
        run: |
          for py in python3.11 python3.14 python3.15; do
            "$py" -m venv "$RUNNER_TEMP/wheel-$py"
            bin="$RUNNER_TEMP/wheel-$py/bin"
            "$bin/python" -m pip install --quiet dist/*.whl
            mkdir "$RUNNER_TEMP/adopt-$py"
            (cd "$RUNNER_TEMP/adopt-$py" && "$bin/aidd" --version && git init -q && "$bin/aidd" init --profile solo --ci github --approvers email:ci@example.com && "$bin/aidd" doctor)
          done
      # The single-file build, run from outside the checkout with nothing on PYTHONPATH.
      - name: The zipapp runs on its own (3.14)
        run: |
          PYTHONPATH=src python3.14 -m aidd.pyz "$RUNNER_TEMP/aidd.pyz"
          (cd "$RUNNER_TEMP" && python3.14 aidd.pyz --version)

  # Weekly and by hand, never on a pull request or a push to main: every other Python on Linux (a new one as a
  # prerelease, before it ships), and on macOS and Windows only in a manual run; Linux 3.14 and 3.15 ran in the test job.
  matrix:
    if: github.event_name != 'pull_request' && github.event_name != 'push' && (github.event_name != 'schedule' || github.event.schedule == '37 3 * * 6')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.15" }
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      # Ubuntu 24.04 stops a program from making the user namespaces Chrome's sandbox needs, unless AppArmor names it.
      # The runner is a throwaway machine, so lift that limit for the run and keep Chrome's own sandbox on.
      - name: Let Chrome make its sandbox
        if: runner.os == 'Linux'
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # The viewer's behavior tests run on Linux, where the runner has Chrome; the macOS and Windows runs skip them.
      - run: python -m unittest discover -s tests -v
        env:
          AIDD_BROWSER_TESTS: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: python -m aidd gen-docs --check
      - run: python -m aidd eval examples
      - run: python -m aidd validate

  # With the matrix: builds once, uploads the dists for the wheel job, and checks that the sdist runs its own tests
  # (the test job already built and installed the wheel).
  build:
    if: github.event_name != 'pull_request' && github.event_name != 'push' && (github.event_name != 'schedule' || github.event.schedule == '37 3 * * 6')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.24  # unquoted: tests/test_version.py reads quoted `version:` lines as aidd pins
      # The same hash-locked backend the release uses.
      - run: uv build --build-constraint .github/requirements/build.txt --require-hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-dist
          path: dist/
          retention-days: 7
      # Outside any git checkout, as a packager runs it: a test that needs git state builds its own repository.
      - name: The sdist runs its own tests
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*
          python3.14 -m unittest discover -s tests

  # With the matrix: the installed wheel on the oldest and the newest Python, on Linux weekly and on every OS by hand.
  # The wheel is pure Python, and the test job installs it on Linux for every pull request and push.
  wheel:
    if: github.event_name != 'pull_request' && github.event_name != 'push' && (github.event_name != 'schedule' || github.event.schedule == '37 3 * * 6')
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.11", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-dist
          path: dist/
      - name: The wheel carries schemas, skill, and templates
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          if [ -x "$RUNNER_TEMP/wheel/Scripts/python.exe" ]; then bin="$RUNNER_TEMP/wheel/Scripts"; else bin="$RUNNER_TEMP/wheel/bin"; fi
          "$bin/python" -m pip install --quiet dist/*.whl
          mkdir "$RUNNER_TEMP/adopt"
          cd "$RUNNER_TEMP/adopt"
          "$bin/aidd" --version
          git init -q
          "$bin/aidd" init --profile solo --ci github --approvers email:ci@example.com  # CI has no operator to name
          "$bin/aidd" doctor

  # The weekly guard sweep, scheduled-only (Monday, and by hand): a large, rotating sample of the property-based sweep in
  # tests/test_guard_shell_sweep.py. The generator (tests/guard_shell_forms.py) dresses ref-moving git commands in every
  # shell form; the guard reads each line, then real bash and git run it in a throwaway copy, and a line the guard
  # allowed that git moved is a bypass. The normal suite runs a small fixed sample on every pull request; this job runs
  # a larger one seeded by the ISO week, so each week sweeps new shapes. It needs no secret and only a read-only token.
  # A failure prints each line the guard allowed that git moved. It is not a required check, so a red run is a signal a
  # person reads, not a merge block, and `ci passed` does not wait for it.
  guard-sweep:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 7 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.run_guard_sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # check out the sweep and the guard it reads
    env:
      # A larger, rotating sample: ~1000 lines in all, the seed the ISO week, so a new run sweeps new shapes.
      AIDD_GUARD_SWEEP_PER_CATEGORY: ${{ inputs.per_category || '333' }}
      AIDD_GUARD_SWEEP_SEED: week
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # One file, run the way the whole suite runs it. A bypass fails the job, and the failing test's message lists
      # each allowed line that moved a protected ref.
      - name: Sweep the guard against real git
        run: python3 -P tests/run.py guard_shell_sweep

  # The weekly standards check, scheduled-only (Monday, and by hand): fetch every standard's evidence URL again and check
  # that the quoted sentence is still on the page (`aidd eval standards --online`), and flag a library tool with a newer
  # major release. The report goes to the job summary and is kept as an artifact. It reads the registry and never edits
  # it, and it never commits: a moved quote is a change a person makes, and an Approver approves it (CONTRIBUTING.md,
  # "Update a standard"). An unreachable page is not a finding; a moved or missing quote fails the run (--strict).
  # Opening an issue is off by default: set the repository variable AIDD_STANDARDS_ISSUES=true for the schedule, or the
  # open_issue input for one manual run. Only then does `standards-issue` run, and it alone can write issues.
  # templates/github/aidd-standards.yml is the same check for an adopter; tests/test_knowledge_maintenance.py keeps
  # their permissions and conditions in line. `ci passed` does not wait for these jobs.
  standards:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 5 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.run_standards)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read  # check out the registry
    outputs:
      stale: ${{ steps.online.outputs.stale }}
    env:
      PYTHONPATH: src  # the CLI from the source tree, with no install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Bounded: a timeout per request, a cap on the whole run, a byte limit per page, and at most two requests in
      # flight, one per host. Exit 1 means a quote moved or went missing, or a library tool has a newer major release
      # than its standard's checked_version (the release-feed check); anything above 1 is an error.
      - name: Re-read every evidence URL
        id: online
        env:
          # Read-only, and sent to api.github.com alone: an extension's evidence is a GitHub API answer, and the API
          # allows few reads without a token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -P -m aidd eval standards --online --strict --json --max-seconds 900 > knowledge.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then cat knowledge.json; exit "$code"; fi
          python3 -P -c 'import json; from aidd import knowledge; print(knowledge.markdown(json.load(open("knowledge.json", encoding="utf-8"))), end="")' > knowledge.md
          cat knowledge.md >> "$GITHUB_STEP_SUMMARY"
          echo "stale=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge
          path: |
            knowledge.json
            knowledge.md
          retention-days: 90
      - name: Fail on a moved or missing quote
        if: steps.online.outputs.stale == 'true'
        run: |
          echo "::error::A quote in the standards registry moved or went missing, or a library tool has a newer major release; the job summary lists each one"
          exit 1

  standards-issue:
    needs: standards
    if: always() && needs.standards.outputs.stale == 'true' && (inputs.open_issue || vars.AIDD_STANDARDS_ISSUES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write  # open the issue, comment on it, and create its label
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knowledge
      # One open issue at a time: a later run with findings adds a comment instead of a new issue.
      - name: Open the issue, or add to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          label="aidd-standards"
          gh label create "$label" --color 1D76DB --description "aidd: a standard's evidence moved or went missing" 2>/dev/null || true
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // ""')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file knowledge.md
          else
            gh issue create --title "aidd: a standard's evidence moved or went missing" --label "$label" --body-file knowledge.md
          fi

  # One stable check for the branch ruleset, whatever runs: it fails when any job above failed or was cancelled,
  # and a skipped job (the matrix, build, and wheel jobs on a pull request or a push, and all five on the Monday crons) counts as passing.
  ci-passed:
    name: ci passed
    if: always()
    needs: [checks, test, matrix, build, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a ci job ended $r"; exit 1 ;; esac
          done
