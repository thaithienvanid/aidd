# Dogfood: this repository's tests on every pull request (see templates/github/aidd-tests.yml), green on the head and
# red on the base for new behavior, with the evidence uploaded. The runner runs from the base commit's source,
# extracted to its own folder, so the PR's copy of aidd is not the code that starts the tests. The tests themselves are
# the PR's code, so the evidence is only as honest as those tests: the Spec approval and the Merge approval review
# cover that. The branch ruleset requires the `tests` check.
name: aidd-tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: aidd-tests-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # No package build, so no unpinned build backend, and nothing from the PR's copy of aidd starts the tests.
      - name: Extract the runner from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          mkdir "$RUNNER_TEMP/aidd-base"
          git archive --format=tar "$BASE_SHA" src schemas | tar -x -C "$RUNNER_TEMP/aidd-base"
      # Ubuntu 24.04 stops a program from making the user namespaces Chrome's sandbox needs, unless AppArmor names it.
      # The runner is a throwaway machine, so lift that limit for the run and keep Chrome's own sandbox on.
      - name: Let Chrome make its sandbox
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Run the tests (green on head, red on base)
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          PYTHONPATH: ${{ runner.temp }}/aidd-base/src
          AIDD_BROWSER_TESTS: "1"  # the viewer's behavior tests, in the runner's Chrome, against a page served from 127.0.0.1 only
        run: python3 -P -m aidd test --base "origin/${BASE_REF#refs/heads/}" --red-in-place --out "$RUNNER_TEMP/aidd-evidence"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidd-evidence
          path: ${{ runner.temp }}/aidd-evidence/
          retention-days: 90
          if-no-files-found: ignore
