# OpenSSF Scorecard: supply-chain posture, published to the Scorecard API and code scanning.
name: scorecard

# Weekly, and by hand: the posture it scores, branch protection included, changes slowly. Only while the repository
# is public: Scorecard publishes results for public repositories only, and its code scanning upload needs GitHub Code
# Security on a private one.
on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

# publish_results limits this workflow to the shape Scorecard's API accepts: no top-level env,
# defaults, or concurrency, and only the approved actions below.
permissions: {}

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # read the repository
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish the results to the Scorecard API (OIDC)
      actions: read          # read workflow runs for the CI-Tests check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
