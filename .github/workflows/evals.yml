# Agent evals: the routing scenarios and the role scenarios, run against a real agent on a schedule and by hand
# (workflow_dispatch). They need the Anthropic API key, and the key never reaches a pull request's code: the
# scenarios, their data, and evals/ support code are all the pull request's to rewrite, so a pull_request run never
# gets the environment, never reads the secret, and runs no live agent. On a pull request that changes what the
# agents read (the skill, the plugins, the roles registry, the scenarios, AGENTS.md), the job says so and measures
# nothing; a maintainer reads the diff, then runs the evals by hand on the branch (Actions, evals, Run workflow),
# and the Merge approval reviewer reads that run's result before approving. That manual run executes the branch's
# code with the key, so run it only on a branch you have read. The runs fail below --min-accuracy.
#
# Do not make `agent-evals` a required check: the paths filter means most pull requests never run it, and a
# required check that never reports waits as "Expected" forever.
#
# The API key is a secret on the `evals` environment where the plan offers environment secrets (its deployment
# branches: main, and the branches a maintainer dispatches on), else a repository secret; either way only the
# schedule and a manual run read it. Every run with the key appends its measurements to evals-results.jsonl, kept as
# an artifact; evals/routing/README.md and evals/roles/README.md say how to read them and where to record scores.
name: evals

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".agents/**"
      - "plugins/**"
      - "schemas/roles.json"
      - "schemas/packs.json"
      - "schemas/industry-standards.json"
      - "evals/**"
      - "AGENTS.md"
      - ".github/workflows/evals.yml"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-evals:
    runs-on: ubuntu-latest
    # Three trials and a control on the schedule: six agent calls per scenario.
    timeout-minutes: 240
    # No pull request asks for the environment or reads the secret, from a fork or from this repository.
    environment: ${{ github.event_name != 'pull_request' && 'evals' || '' }}
    env:
      HAS_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY != '' }}
      PYTHONPATH: src  # the CLI from the source tree, with no install and so no unpinned build backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The agents under evaluation find a bare `aidd` on PATH, as they did with an editable install: a shim that runs
      # this checkout's source tree, so nothing is built and no unpinned build backend is fetched.
      - name: Put the source-tree CLI on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/aidd-bin"
          printf '#!/bin/sh\nPYTHONPATH="%s/src" exec "%s" -m aidd "$@"\n' "$GITHUB_WORKSPACE" "$(command -v python)" > "$RUNNER_TEMP/aidd-bin/aidd"
          chmod +x "$RUNNER_TEMP/aidd-bin/aidd"
          echo "$RUNNER_TEMP/aidd-bin" >> "$GITHUB_PATH"
      # Currency is a calendar check, so it runs on the schedule and by hand, never on a pull request: a standard past
      # its review cadence (its own review_every_days, else emerging 90 days or established a year, or its review_due)
      # turns this run red, not an unrelated change.
      - name: Standards currency
        if: github.event_name != 'pull_request'
        run: python -m aidd eval standards
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_KEY == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/mermaid/package-lock.json
      # The agent CLI is locked in tools/mermaid/package-lock.json, where Dependabot sees it.
      - name: Install the agent CLI
        if: env.HAS_KEY == 'true'
        run: |
          npm ci --prefix tools/mermaid --no-audit --no-fund
          echo "$PWD/tools/mermaid/node_modules/.bin" >> "$GITHUB_PATH"
      # The schedule and a manual run repeat each scenario three times (pass@1 and pass^3), add the no-skill control
      # (the lift, never gating), and keep every run as a JSON line: download the artifacts and `aidd eval report`
      # them over time.
      # Set the EVALS_MODEL_LABEL repository variable to the model the agent CLI runs; aidd never guesses it.
      - name: Routing eval
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          MODEL_LABEL: ${{ vars.EVALS_MODEL_LABEL }}
        run: |
          measure=(--repeat 3 --without-aidd --record evals-results.jsonl)
          if [ -n "$MODEL_LABEL" ]; then measure+=(--model-label "$MODEL_LABEL"); fi
          python -m aidd eval routing --agent-command "claude -p" --min-accuracy 0.9 "${measure[@]}"
      - name: Role evals
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          MODEL_LABEL: ${{ vars.EVALS_MODEL_LABEL }}
        run: |
          measure=(--repeat 3 --without-aidd --record evals-results.jsonl)
          if [ -n "$MODEL_LABEL" ]; then measure+=(--model-label "$MODEL_LABEL"); fi
          python -m aidd eval roles --agent-command "claude -p" --min-accuracy 0.8 "${measure[@]}"
      # Claude Code's own plugin evals (evals/plugin/ and plugins/aidd-team/evals/): what each plugin changes about an
      # agent's behavior, scored against a no-plugin baseline. On the schedule and by hand only, three runs a case.
      - name: Plugin evals
        if: env.HAS_KEY == 'true' && github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          claude plugin eval . --trust-plugin --threshold 0.8 --json plugin-evals-aidd.json
          claude plugin eval . --eval-dir plugins/aidd-team/evals --trust-plugin --threshold 0.8 --json plugin-evals-aidd-team.json
      - name: Report the recorded runs
        if: always() && env.HAS_KEY == 'true' && hashFiles('evals-results.jsonl') != ''
        run: python -m aidd eval report evals-results.jsonl >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the recorded runs
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals-results.jsonl
          if-no-files-found: ignore
          # 90 is the platform maximum for artifacts. To compare runs over a longer span, copy the lines to durable storage.
          retention-days: 90
      - name: Keep the plugin eval results
        if: always() && env.HAS_KEY == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-evals-${{ github.run_id }}-${{ github.run_attempt }}
          path: plugin-evals-*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: A pull request measures nothing
        if: github.event_name == 'pull_request'
        run: |
          msg="A pull request never runs the agent evals: its code would run with the API key. This change touches what the agents read, so a maintainer reads it, then runs the evals by hand on this branch (Actions, evals, Run workflow) before Merge approval"
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: No API key
        if: env.HAS_KEY != 'true' && github.event_name != 'pull_request'
        run: |
          msg="ANTHROPIC_API_KEY is not available to this run (no secret on the evals environment or the repository); the agent evals were skipped, so this run measured nothing"
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
