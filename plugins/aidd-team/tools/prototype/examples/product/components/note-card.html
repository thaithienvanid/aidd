<article class="note-card" data-component="note-card">
  <div class="note-head">
    <h2 data-field="title"></h2>
    <span class="badge" data-component="status-badge" data-field="status"></span>
  </div>
  <p class="note-meta" data-field="meta"></p>
  <p class="note-excerpt" data-field="excerpt"></p>
  <div class="note-actions">
    <button type="button" class="button button-secondary" data-component="button" data-variant="secondary" data-testid="open-note">{{action}}</button>
  </div>
</article>
