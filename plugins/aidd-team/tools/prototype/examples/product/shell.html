<style id="tokens">

  --typography-heading: 600 1.25rem/1.25 ui-serif, "New York", Georgia, "Noto Serif", serif;

    --duration-base: 0ms;

:root,

:root[data-theme="dark"] {

    --color-text-muted: #b4beb7;
    --color-border: #2c332e;
    --color-border-strong: #737e76;
    --color-divider: #dfe3de1f;
    --color-accent: #7fd4a8;
    --color-accent-strong: #a7e4c5;
    --color-accent-subtle: #183626;
    --color-on-accent: #092014;

<style id="styles">
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; font: var(--typography-body); font-variant-numeric: tabular-nums; background: var(--color-surface); color: var(--color-text); container: frame / inline-size; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  [data-field], [data-text] { unicode-bidi: plaintext; }

  /* Interactive controls */

  .button-primary:hover { background: var(--color-accent-strong); }
  .button-secondary { border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-text); }
  .button-secondary:hover { background: var(--color-surface-sunken); }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-control); min-height: var(--size-control); padding: var(--space-1) var(--space-2); max-width: 100%; }
  input:is([type="checkbox"], [type="radio"]) { flex: none; width: var(--size-target-min); height: var(--size-target-min); accent-color: var(--color-accent); cursor: pointer; }
  :is(button, input, select, textarea):disabled, [aria-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
  :root[data-platform="ios"] :is(.button, .back, .drawer-toggle, .tabs button) { min-height: 2.75rem; }
  :root[data-platform="android"] :is(.button, .back, .tabs button, .drawer-toggle, .check-row, input:not([type="checkbox"]):not([type="radio"]), select) { min-height: 3rem; }

  /* Product chrome */
  .device { display: grid; min-height: 100dvh; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; grid-template-areas: "brand nav" "bar bar" "main main"; }
  .brand { grid-area: brand; margin: 0; display: flex; align-items: center; gap: var(--space-2); min-width: 0; padding-block: var(--space-3); padding-inline: max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)) var(--space-3); border-block-end: 1px solid var(--color-border); font: var(--typography-heading); letter-spacing: var(--font-tracking-tight); }
  .logo { width: 1.375rem; height: 1.375rem; flex: none; color: var(--color-accent); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tabs { grid-area: nav; display: flex; flex-wrap: wrap; gap: 0 var(--space-4); align-items: center; padding-inline: var(--space-3) max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)); border-block-end: 1px solid var(--color-border); }
  .tabs button { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); min-height: 2.75rem; padding: 0; border: 0; background: none; color: var(--color-text-muted); font-weight: var(--font-weight-medium); cursor: pointer; transition: color var(--duration-fast) var(--easing-standard); }
  .tabs button:hover, .tabs button[aria-current="page"] { color: var(--color-text); }

  .appbar { grid-area: bar; display: flex; align-items: center; gap: var(--space-2); padding-block: var(--space-5) 0; padding-inline: max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)); min-width: 0; }
  .appbar h1 { margin: 0; font: var(--typography-title); letter-spacing: var(--font-tracking-tight); overflow-wrap: anywhere; text-wrap: balance; }
  .back { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 2.75rem; padding-block: var(--space-1); padding-inline: 0 var(--space-2); border: 0; background: none; color: var(--color-accent); font-weight: var(--font-weight-medium); cursor: pointer; max-width: 100%; }
  .back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back:hover span { text-decoration: underline; text-underline-offset: 0.2em; }
  :root[dir="rtl"] .back svg { transform: scaleX(-1); }
  :root[data-platform="web"] .appbar { flex-wrap: wrap; }
  :root[data-platform="web"] .back { flex-basis: 100%; max-width: none; }
  :root:is([data-platform="ios"], [data-platform="android"]) .device { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; grid-template-areas: "bar" "main" "nav"; }
  :root:is([data-platform="ios"], [data-platform="android"]) .brand { display: none; }
  :root:is([data-platform="ios"], [data-platform="android"]) .appbar { position: sticky; top: 0; z-index: 2; flex-wrap: nowrap; min-height: 44px; padding: calc(max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) + var(--space-2)) var(--space-3) var(--space-2); background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: var(--filter-glass); border-block-end: 1px solid var(--color-border); }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs { position: sticky; bottom: 0; z-index: 2; flex-wrap: nowrap; justify-content: space-around; gap: 0; padding-block: var(--space-1) calc(max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)) + var(--space-1)); padding-inline: 0; background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: var(--filter-glass); border-block-start: 1px solid var(--color-border); border-block-end: 0; }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs button { flex-direction: column; gap: 2px; min-width: 4.5rem; min-height: 2.75rem; padding: var(--space-1) var(--space-2); font-size: 0.75rem; border-radius: var(--radius-control); }
  :root[data-platform="ios"] .appbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  :root[data-platform="ios"] .appbar .back { grid-column: 1; justify-self: start; }
  :root[data-platform="ios"] .appbar h1 { grid-column: 2; font: 600 1.0625rem/1.3 var(--font-family-serif); letter-spacing: 0; text-align: center; }
  :root[data-platform="ios"] .appbar:has(> .back[hidden]) { position: static; display: block; padding-block-end: var(--space-3); border-block-end-color: transparent; }
  :root[data-platform="ios"] .appbar:has(> .back[hidden]) h1 { font: var(--typography-title); letter-spacing: var(--font-tracking-tight); text-align: start; }
  :root[data-platform="ios"] .tabs button[aria-current="page"] { background: none; color: var(--color-accent); }
  :root[data-platform="android"] .appbar { min-height: 64px; }
  :root[data-platform="android"] .appbar h1 { font: 600 1.375rem/1.3 var(--font-family-serif); letter-spacing: 0; }
  :root[data-platform="android"] .back { min-width: 48px; min-height: 48px; justify-content: center; padding: 0; color: var(--color-text); }
  :root[data-platform="android"] .back span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  :root[data-platform="android"] .icon-ios { display: none; }
  :root[data-platform="android"] .icon-android { display: block; }
  :root[data-platform="android"] .tabs button { min-height: 3rem; }
  :root[data-platform="android"] .tabs button[aria-current="page"] { background: none; }
  :root[data-platform="android"] .tabs button[aria-current="page"] svg { background: var(--color-accent-subtle); color: var(--color-accent-strong); border-radius: var(--radius-pill); width: 1.5rem; padding: 0.25rem 1.25rem; box-sizing: content-box; }
  @container frame (max-width: 29.9375rem) {
    :root[data-platform="web"] .device { grid-template-columns: minmax(0, 1fr); grid-template-areas: "brand" "nav" "bar" "main"; grid-template-rows: auto auto auto 1fr; }
    :root[data-platform="web"] .brand { border-block-end: 0; padding-block-end: 0; }
    :root[data-platform="web"] .tabs { padding-inline: var(--space-3); }
    :root[data-platform="web"] .appbar { padding-block-start: var(--space-4); }
  }
  @container frame (max-width: 18rem) {

  }

  /* Main layout and editorial blocks */
  main { grid-area: main; padding-block: var(--space-3) var(--space-6); padding-inline: max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)); min-width: 0; }
  main:focus, #screen-title:focus { outline: none; }
  section[data-screen], section[data-screen] > [data-state] { display: none; }
  section[data-screen].shown, section[data-screen] > [data-state].shown { display: block; }
  main :is(h2, h3) { margin: var(--space-3) 0 var(--space-2); font-family: var(--font-family-serif); font-weight: var(--font-weight-semibold); line-height: 1.2; letter-spacing: var(--font-tracking-tight); text-wrap: balance; }
  main p { margin: 0 0 var(--space-3); max-width: 62ch; text-wrap: pretty; }
  .lede { display: flex; align-items: center; gap: var(--space-2); margin-block-end: var(--space-3); color: var(--color-text-muted); font-size: var(--font-size-small); }
  .lede .icon { color: var(--color-accent); }

  /* Sync banner and inline messages */
  .queue-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-3); margin-block-end: var(--space-4); padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface-raised); font-size: var(--font-size-small); }
  .queue-status { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-text); font-weight: var(--font-weight-medium); }
  .message { display: flex; align-items: flex-start; gap: 0.625rem; margin: 0 0 var(--space-4); padding: 0.75rem 1rem; border-radius: var(--radius-control); font-size: 0.9375rem; max-width: 62ch; }
  .message .icon { margin-block-start: 0.125em; }
  .message-error { background: var(--color-danger-subtle); color: var(--color-danger); }
  .message-warning { background: var(--color-warning-subtle); color: var(--color-warning); }

  /* Note cards and status badges */
  .note-list { display: grid; gap: var(--space-3); margin-block-end: var(--space-4); }
  .note-card { position: relative; display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-surface); background: var(--color-surface-raised); }
  .note-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-2); }
  .note-head h2 { margin: 0; font-size: 1.1875rem; }
  .note-meta { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-small); }
  .note-excerpt { margin: 0; color: var(--color-text); }
  .note-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-block-start: var(--space-1); }
  .badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0.1875rem 0.625rem; border-radius: var(--radius-pill); font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); white-space: nowrap; background: var(--color-surface-sunken); color: var(--color-text-muted); }
  .badge svg { width: 0.9em; height: 0.9em; }

  /* Empty state spot block */
  .spot { display: grid; grid-template-columns: var(--size-spot) minmax(0, 1fr); gap: var(--space-3) var(--space-4); align-items: start; padding-block: var(--space-4); border-block: 1px solid var(--color-border); }
  .spot h2 { margin: 0 0 var(--space-2); font-size: var(--font-size-heading); }
  .spot p { color: var(--color-text-muted); max-width: 46ch; }
  .spot-art { display: grid; place-items: center; width: var(--size-spot); aspect-ratio: 1; border-radius: var(--radius-surface); background: var(--color-accent-subtle); color: var(--color-accent); }
  .spot-art svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  @container frame (max-width: 29.9375rem) {
    .spot { grid-template-columns: minmax(0, 1fr); }
  }

  /* Loading skeletons */
  .skeleton { display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-surface); background: var(--color-surface-raised); }
  .skeleton span { display: block; height: 0.875rem; border-radius: var(--radius-pill); background: linear-gradient(90deg, var(--color-surface-sunken) 40%, var(--color-border) 50%, var(--color-surface-sunken) 60%) 0 0 / 300% 100%; animation: shimmer var(--duration-shimmer) ease-in-out 3; }
  .skeleton span:first-child { width: 52%; height: 1.125rem; }
  .skeleton span:nth-child(2) { width: 38%; }
  .skeleton span:nth-child(3) { width: 82%; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* Note detail and disclosure timeline */
  .detail-panel { display: grid; gap: var(--space-3); max-width: 44rem; }
  .detail-header { display: grid; gap: var(--space-2); padding-block-end: var(--space-3); border-block-end: 1px solid var(--color-border); justify-items: start; }
  .detail-header h2 { margin: 0; font-size: var(--font-size-heading); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--space-3); margin: 0; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-surface); background: var(--color-surface-raised); }
  .facts div { display: grid; gap: var(--space-1); }
  .facts dt { font-size: var(--font-size-caption); color: var(--color-text-muted); font-weight: var(--font-weight-semibold); }
  .facts dd { margin: 0; font-weight: var(--font-weight-medium); }

  .drawer-toggle:hover { background: var(--color-surface-sunken); }

  /* Settings */
  fieldset { border: 1px solid var(--color-border); border-radius: var(--radius-surface); background: var(--color-surface-raised); padding: var(--space-3) var(--space-4); margin: 0 0 var(--space-4); min-width: 0; max-width: 40rem; }
  legend { padding: 0 var(--space-2); font-family: var(--font-family-serif); font-weight: var(--font-weight-semibold); font-size: 1.125rem; }

</style>
