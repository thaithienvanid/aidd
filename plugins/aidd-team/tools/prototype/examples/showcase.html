<!doctype html>
<html lang="en" data-aidd-prototype="1">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aidd-spec" content="the showcase">
<title>Find a sitter: prototype for the showcase</title>
<!--
  The prototype tool's showcase: a complete example design, to learn the format from. A design artifact: frozen at Spec approval with the Spec, compared with
  the built UI screen by screen and state by state in Review, and never imported by product code. One self-contained
  file per Spec or flow (`aidd new design-spec --prototype` writes specs/<ID>/design/prototype.html): no network, no build step,
  show it with `aidd prototype`. The Content-Security-Policy above blocks every remote load; keep it. The design spec
  (`aidd new design-spec`) holds what a prototype cannot show. A prototype is interactive; a mockup is a static picture, and
  a rough direction is an exploration's, before a person picks one (`aidd explore`).

  This file is the design alone: everything inside <template id="product">, its tokens, its styles, its chrome, and
  its screens, with its example data in the fixtures block. aidd-team's prototype tool shows it in the prototype viewer
  (`aidd prototype <this file>`): the review column, device frames, the Board with every screen in every state, System
  with the tokens and components, build details, and full screen. Each screen renders in its own frame, so its styles reach
  only the screens, as they will in the built UI. The viewer is never copied here, so every fix to it reaches this
  file, and Spec approval freezes only the design.

  - Screens: one <section data-screen="<id>" data-title="..."> each, in flow order; the first is where the flow starts.
    The three here (sign in, a list, a detail) are an example: replace them with the Spec's screens, by the names its
    design spec's Screen inventory uses. data-parent names the screen the back affordance returns to; data-initial the
    state a screen opens in. The review column and the Board are built from the sections, so they always list every screen.
  - Components: name each reusable part with data-component="<name>", and its variant with data-variant="<variant>"
    (a button, a card, a message, a field). The System view lists each with its variants, a live specimen, and the
    screens that use it; the developer builds one component per name, with a story per variant and state. A list
    repeats one item template: <ul data-list="<fixtures key>" data-item-template="<name>"> and, once in the screen,
    <template data-item-template="<name>">, with data-field on the parts the fixtures fill.
  - Navigation: an element with data-go="<screen>" or data-go="<screen>/<state>" moves to it and adds a history entry,
    so the browser's back button, and the back affordance, return. The same screens render on every frame: iOS and
    Android frames show a platform tab bar (Human Interface Guidelines, Material 3) and a back affordance; web frames
    show header navigation. Each frame is its own document, so media queries and @container frame follow the frame's
    width, and the product's styles read the platform from :root[data-platform="ios"].
  - Deep links: #<screen>/<state>?theme=dark&frame=ios&round=2 in the viewer's address opens that view, and every
    switch updates it. Each key is optional: theme light or dark (else the system's), frame 320, 768, 1024 (the
    default), 1440, fill (full width), ios, android, desktop (1280 by 800), or desktop-1440, round 2 or more,
    panels both, screens, inspector, or none, view canvas or system, feedback=1, the checks text=200, dir=rtl,
    and safe=1, and zoom=actual for the frame
    at its real size (else fitted to the window, as screenshots must not be). The same keys in the page's own
    query (?theme=dark, ?round=2) still work; the fragment wins. Screenshots and tests open a
    view by its link: <screen>-<state>-<target>-<theme>.png is the viewer's #<screen>/<state>?theme=<theme>&frame=<target>&zoom=actual.
  - Tokens: every custom property lives in the one style block with the id tokens, the output of design/build.mjs
    (design/tokens.css, then design/themes/*.css): paste the repository's in its place, and never invent a value it
    lacks. The product's styles only read them with var(), by the build's names (--color-surface, --radius-control).
  - Fixtures: every piece of data lives in the one JSON script block with the id fixtures; the screens read it, so a
    longer name or an empty list is one edit away. Text goes in with textContent, never as markup.
  - States: empty, loading, partial, error, offline, permission denied, success (the loaded, ideal view), first run:
    each screen has the ones it can be in, as <div data-state> children (a child without data-state shows in every
    state), reachable with one click, keys 1-8, or the deep link. A state a screen cannot have is left out, and the
    design spec says why. A screen adds its own by name, such as no-results (a search found nothing, not first use),
    submitting, validation-error, not-found, session-expired, or confirm-<action>; the review column lists them after the
    eight.
  - Safe areas: on a phone the system bars sit over the screen. Pad the chrome by
    max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) (and -bottom), so the viewer's values and the
    built app's env() both hold; Checks, Safe areas, in the toolbar shows them. Use 100dvh, never 100vh.
  - Frames: 320, 768, 1024, and 1440 CSS px in a browser window, or its full width, iOS and Android phones, and a
    desktop app's window at 1280 or 1440, to check each breakpoint and platform. The Board shows every screen in every state, at the frame's size. Full screen (F,
    or the button; Esc leaves) shows the screen alone and still clickable: a web frame fills the screen, a phone fits it.
  - Theme: light and dark (project.defaults.dark_mode). The prototype follows the system's prefers-color-scheme until
    the Theme control picks one (?theme=dark keeps it); check contrast, and take each screenshot, in both.
  - Feedback: Add a note (or ?feedback=1, and ?round=2 for the round) turns on feedback mode: click an
    element in the prototype, or pick it in the list, type a note, and add it; a numbered pin marks it. Download
    gives the round as feedback-round-N.json, {"round": N, "items": [{"id", "screen", "state", "testid", "index",
    "box", "note", "link", ...}]}, to save in the design folder; index names which of the elements sharing a
    data-testid; Copy the JSON and Copy as a prompt give the same. The notes stay in this browser (localStorage), per
    design and round, and are never sent anywhere.
  - data-testid on every interactive element, in lowercase words joined by hyphens: the hook the verifier's tests
    select on, inside the frame with the id frame; keep the names when the UI is built (iOS accessibilityIdentifier
    and Android testTag use the same names). proto-* ids are the viewer's own controls.
  - Real copy and realistic data, never filler text. Keyboard-operable, labelled, WCAG 2.2 AA contrast, and targets of
    at least 24 by 24 px.

  The plan for this design, written before its code. Every design writes its own, from its own people and its own
  design system, and the review checks the built UI against it. This one shows the form; it is never a default to copy.
  - Who: a pet owner in Kreuzberg, deciding whether to trust a person with their dog or cat. They choose a person, so
    the person leads every screen.
  - Principles: people first, so each sitter is a row led by their photo and their name. Rows on a white page, not
    floating cards, so the eye runs down the people. A hairline separates them, and nothing casts a shadow. One accent
    marks what you can do and where you are. Each state has one drawing, or none.
  - Color roles, light and dark, keep each value in the tokens block. Surface is white, not cream. Surface-sunken is
    the gray-green well behind notices, skeletons, and an empty photo slot. Border is the hairline, and border-strong a
    field's edge, at 3:1. Text and text-muted are the ink and its quieter voice, at 4.5:1 or more on every surface.
    Accent is park green, for actions, links, and the current tab. Highlight is amber, for the rating star alone, and
    danger is for errors alone. A warning is a notice in ink on the sunken well, so amber keeps its one meaning.
  - Type: the system sans for reading, and the system serif (New York, Georgia, or Noto Serif) for names and titles,
    so a name reads as a person, not a field. No web font, because the page loads nothing. Numbers are tabular.
  - Layout: one column, 60rem at most. A row is the photo, then the name, what they take, the rating, and the
    distance; then when they are free; the price comes last, at the row's end. A narrow row, or larger text, moves the
    time under the name, and then the price under the time. The profile sets the person beside the booking card, and
    stacks them on a phone. Phones take their platform's chrome: a large title on iOS, a tab bar, and a back affordance.
  - Photo slots: the built UI shows each sitter's own photo. Here a drawing stands in, never a stock face, and its alt
    text says so. The format fills text only, so a sitter's fixture names its drawing by the one photo-N field it
    holds, and that field's text is the alt text.
-->
<style>body { margin: 2rem auto; max-width: 62ch; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }</style>
</head>
<body>
<p>The prototype tool's showcase: <a href="#" data-testid="proto-spec-link">a pet-sitting app</a>, every state and pattern a design can show. Open it with <code>aidd prototype --example</code>. It is a way to learn the format, never a start: a new design starts from the skeleton, with your own design system.</p>
<template id="product">
<style id="tokens">
/* Generated from design/tokens.json by design/build.mjs: never edit by hand. */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --radius-control: 10px;
  --radius-surface: 16px;
  --radius-photo: 20%;
  --radius-pill: 999px;
  --size-target-min: 24px;
  --size-control: 48px;
  --size-content-max: 60rem;
  --size-photo-compact: 3.5rem;
  --size-photo: 4.75rem;
  --size-photo-large: 8.5rem;
  --size-tab-bar: 4.3125rem;
  --font-family-sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-family-serif: ui-serif, "New York", Georgia, "Noto Serif", serif;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-size-caption: 0.8125rem;
  --font-size-small: 0.875rem;
  --font-size-body: 1rem;
  --font-size-heading: 1.5rem;
  --font-size-title: 2.25rem;
  --font-tracking-normal: 0px;
  --font-tracking-tight: -0.015em;
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-shimmer: 1400ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --typography-body: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --typography-name: 600 1.3125rem/1.2 ui-serif, "New York", Georgia, "Noto Serif", serif;
  --typography-title: 600 2.25rem/1.1 ui-serif, "New York", Georgia, "Noto Serif", serif;
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-shimmer: 0ms;
  }
}
/* The stand-in drawings' colors: the prototype's own, the same in both themes, as a photo is. The built UI shows each
   sitter's photo and reads none of them. */
:root {
  --color-portrait-shade: rgb(0 0 0 / 0.14);
  --color-portrait-1-backdrop: #f1d8c3;
  --color-portrait-1-skin: #e8b892;
  --color-portrait-1-hair: #1d1a1a;
  --color-portrait-1-clothes: #2f5d50;
  --color-portrait-2-backdrop: #d3e1ed;
  --color-portrait-2-skin: #c98e64;
  --color-portrait-2-hair: #3a2a20;
  --color-portrait-2-clothes: #8a4b2a;
  --color-portrait-3-backdrop: #e4d9ef;
  --color-portrait-3-skin: #7a4a2e;
  --color-portrait-3-hair: #24160f;
  --color-portrait-3-clothes: #c4962a;
  --color-portrait-4-backdrop: #d9eadd;
  --color-portrait-4-skin: #f0c9a8;
  --color-portrait-4-hair: #c9a15a;
  --color-portrait-4-clothes: #3b4a6b;
}
/* Generated from design/tokens.json by design/build.mjs: never edit by hand. */
:root,
:root[data-theme="light"] {
  --color-surface: #ffffff;
  --color-surface-raised: #ffffff;
  --color-surface-sunken: #f3f4f1;
  --color-border: #e3e5e2;
  --color-border-strong: #7d847f;
  --color-text: #1a1c1b;
  --color-text-muted: #59605b;
  --color-accent: #1e5e49;
  --color-accent-strong: #154536;
  --color-accent-subtle: #e3efe9;
  --color-on-accent: #ffffff;
  --color-highlight: #a65a00;
  --color-danger: #b42318;
  --color-danger-subtle: #fdecea;
  --color-focus: #1e5e49;
  color-scheme: light;
}
/* Generated from design/tokens.json by design/build.mjs: never edit by hand. */
:root[data-theme="dark"] {
  --color-surface: #121413;
  --color-surface-raised: #181b19;
  --color-surface-sunken: #1d201e;
  --color-border: #2b2f2c;
  --color-border-strong: #757c77;
  --color-text: #eceeec;
  --color-text-muted: #a5aca7;
  --color-accent: #86d0b2;
  --color-accent-strong: #a9e0c9;
  --color-accent-subtle: #17332a;
  --color-on-accent: #0b1f17;
  --color-highlight: #f2b25c;
  --color-danger: #f7a39b;
  --color-danger-subtle: #3a1c19;
  --color-focus: #86d0b2;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-surface: #121413;
    --color-surface-raised: #181b19;
    --color-surface-sunken: #1d201e;
    --color-border: #2b2f2c;
    --color-border-strong: #757c77;
    --color-text: #eceeec;
    --color-text-muted: #a5aca7;
    --color-accent: #86d0b2;
    --color-accent-strong: #a9e0c9;
    --color-accent-subtle: #17332a;
    --color-on-accent: #0b1f17;
    --color-highlight: #f2b25c;
    --color-danger: #f7a39b;
    --color-danger-subtle: #3a1c19;
    --color-focus: #86d0b2;
    color-scheme: dark;

}
</style>
<style id="styles">
  /* The product's styles: they reach only the frames. They read the tokens with var(), by the build's names, and
     follow the frame's root element: data-platform (web, ios, android) and data-theme. Sizes are in rem and em, so
     text at 200% grows the layout with it, and sides are logical (inline, block), so right to left mirrors it. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; font: var(--typography-body); font-variant-numeric: tabular-nums; background: var(--color-surface); color: var(--color-text); container: frame / inline-size; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: var(--color-accent-subtle); color: var(--color-text); }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  button, input { font: inherit; color: inherit; }
  svg.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .icon-android { display: none; }
  /* Data keeps its own direction, so an English name or a price reads right in a right-to-left layout. */
  [data-field], [data-text] { unicode-bidi: plaintext; }

  /* Product chrome. Web: a header with the product's mark and its navigation, the current tab underlined, over one
     centered column. iOS and Android: a top bar with the back affordance, and a tab bar at the bottom. */
  .device { display: grid; min-height: 100dvh; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; grid-template-areas: "brand nav" "bar bar" "main main"; }
  .brand { grid-area: brand; margin: 0; display: flex; align-items: center; gap: 0.5rem; min-width: 0; padding-block: var(--space-3); padding-inline: max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)) var(--space-3); border-block-end: 1px solid var(--color-border); font: var(--typography-name); letter-spacing: var(--font-tracking-tight); }
  .logo { width: 1.5rem; height: 1.5rem; flex: none; fill: var(--color-accent); }
  .tabs { grid-area: nav; display: flex; flex-wrap: wrap; gap: 0 var(--space-4); padding-inline: var(--space-3) max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)); border-block-end: 1px solid var(--color-border); }
  .tabs button { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); min-height: 2.75rem; padding: 0; border: 0; background: none; color: var(--color-text-muted); font-weight: var(--font-weight-medium); cursor: pointer; transition: color var(--duration-fast) var(--easing-standard); }
  .tabs button:hover, .tabs button[aria-current="page"] { color: var(--color-text); }
  .tabs button[aria-current="page"] { font-weight: var(--font-weight-semibold); }
  :root[data-platform="web"] .tabs button[aria-current="page"]::after { content: ""; position: absolute; inset-inline: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--color-accent); }
  .appbar { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding-block: var(--space-5) 0; padding-inline: max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)); min-width: 0; }
  .appbar h1 { margin: 0; font: var(--typography-title); letter-spacing: var(--font-tracking-tight); overflow-wrap: anywhere; text-wrap: balance; }
  .back { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 2.75rem; max-width: 100%; padding-block: 0; padding-inline: 0 var(--space-2); border: 0; background: none; color: var(--color-accent); font-weight: var(--font-weight-medium); cursor: pointer; }
  .back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back:hover span { text-decoration: underline; text-underline-offset: 0.2em; }
  :root[dir="rtl"] .back svg { transform: scaleX(-1); }
  /* On the web, a child screen's own heading names it (a sitter's name), so the screen's title stays for screen readers only. */
  :root[data-platform="web"] .appbar:has(> .back:not([hidden])) h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  :root:is([data-platform="ios"], [data-platform="android"]) .device { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; grid-template-areas: "bar" "main" "nav"; }
  :root:is([data-platform="ios"], [data-platform="android"]) .brand { display: none; }
  :root:is([data-platform="ios"], [data-platform="android"]) .appbar { position: sticky; top: 0; z-index: 2; flex-wrap: nowrap; min-height: 44px; padding: calc(max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) + var(--space-2)) var(--space-3) var(--space-2); background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: saturate(1.6) blur(18px); border-block-end: 1px solid var(--color-border); }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs { position: sticky; bottom: 0; z-index: 2; flex-wrap: nowrap; justify-content: space-around; gap: 0; padding: var(--space-1) 0 calc(max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)) + var(--space-1)); background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: saturate(1.6) blur(18px); border-block-start: 1px solid var(--color-border); border-block-end: 0; }
  /* The tab bar keeps one height, so a bar above it, such as the profile's booking bar, sits clear of it. */
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs { min-height: calc(var(--size-tab-bar) + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px))); }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs button { flex-direction: column; gap: 2px; min-width: 4.5rem; padding: var(--space-1) var(--space-2); font-size: 0.6875rem; border-radius: var(--radius-control); }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs svg.icon { width: 1.625rem; height: 1.625rem; }
  :root:is([data-platform="ios"], [data-platform="android"]) main { padding-block-start: var(--space-3); }
  :root[data-platform="ios"] .appbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  :root[data-platform="ios"] .appbar .back { grid-column: 1; justify-self: start; }
  :root[data-platform="ios"] .appbar h1 { grid-column: 2; font: 600 1.0625rem/1.3 var(--font-family-serif); letter-spacing: 0; text-align: center; }
  /* iOS: a top-level screen, with no back affordance, opens under a large title that scrolls away with it (Human Interface Guidelines). */
  :root[data-platform="ios"] .appbar:has(> .back[hidden]) { position: static; display: block; padding-block-end: var(--space-3); border-block-end-color: transparent; }
  :root[data-platform="ios"] .appbar:has(> .back[hidden]) h1 { font: 600 2rem/1.15 var(--font-family-serif); letter-spacing: var(--font-tracking-tight); text-align: start; }
  /* Once the large title has scrolled away, the bar's material stays behind the status bar. */
  :root[data-platform="ios"] .device:has(.appbar > .back[hidden])::before { content: ""; grid-area: bar; align-self: start; position: sticky; top: 0; z-index: 3; height: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)); background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: saturate(1.6) blur(18px); }
  :root[data-platform="ios"] .tabs button[aria-current="page"] { color: var(--color-accent); }
  :root[data-platform="android"] .appbar { min-height: 64px; }
  :root[data-platform="android"] .appbar h1 { font: 600 1.375rem/1.3 var(--font-family-serif); letter-spacing: 0; }
  :root[data-platform="android"] .back { min-width: 48px; min-height: 48px; justify-content: center; padding: 0; color: var(--color-text); }
  :root[data-platform="android"] .back span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  :root[data-platform="android"] .icon-ios { display: none; }
  :root[data-platform="android"] .icon-android { display: block; }
  :root[data-platform="android"] .tabs button[aria-current="page"] svg { background: var(--color-accent-subtle); color: var(--color-accent-strong); border-radius: var(--radius-pill); width: 1.5rem; padding: 0.25rem 1.25rem; box-sizing: content-box; }
  @container frame (max-width: 29.9375rem) {
    :root[data-platform="web"] .device { grid-template-columns: minmax(0, 1fr); grid-template-areas: "brand" "nav" "bar" "main"; grid-template-rows: auto auto auto 1fr; }
    :root[data-platform="web"] .brand { border-block-end: 0; padding-block-end: 0; }
    :root[data-platform="web"] .tabs { padding-inline: var(--space-3); }
    :root[data-platform="web"] .appbar { padding-block-start: var(--space-4); }
    :root[data-platform="web"] .appbar h1 { font-size: 1.875rem; }
  }

  /* Screens and their states: one of each shows at a time. */
  main { grid-area: main; padding-block: var(--space-3) var(--space-6); padding-inline: max(var(--space-3), calc((100cqi - var(--size-content-max)) / 2)); min-width: 0; }
  main:focus, #screen-title:focus { outline: none; }
  section[data-screen], section[data-screen] > [data-state] { display: none; }
  section[data-screen].shown, section[data-screen] > [data-state].shown { display: block; }
  main :is(h2, h3) { margin: var(--space-4) 0 var(--space-2); font-family: var(--font-family-serif); font-weight: var(--font-weight-semibold); line-height: 1.2; letter-spacing: var(--font-tracking-tight); text-wrap: balance; }
  main h2 { font-size: var(--font-size-heading); }
