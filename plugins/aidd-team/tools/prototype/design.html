<!doctype html>
<html lang="en" data-aidd-prototype="1">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aidd-spec" content="{{spec}}">
<title>{{title}}: prototype for {{spec}}</title>
<!--
  Prototype for Spec {{spec}}, written {{today}}. This file is a design artifact, the design alone: Spec approval freezes it, Review compares
  the built UI with it state by state, and product code never imports it. `aidd prototype <this file>` shows it in
  aidd-team's prototype viewer, and `--check` checks it. The viewer's README, tools/prototype/README.md in aidd-team, says
  how each part works, and `aidd prototype --example` shows a complete design.

  The rules:
  - Keep the Content-Security-Policy above. The design loads nothing and runs nothing: no script, handler, or embed.
  - The design lives in <template id="product">: its tokens, styles, chrome, and screens. That tag ends its line, and
    the fixtures block starts on the line right after its </template>.
  - Tokens: paste the design system's build output (design/build.mjs) into the style block with the id tokens. The
    styles read them with var(), by the build's names, and never hold a raw color.
  - Screens: one <section data-screen="<id>" data-title="..."> each, in flow order. data-parent names the screen Back
    returns to, and data-initial the state the screen opens in.
  - States: one <div data-state="<name>"> each: empty, loading, partial, error, offline, permission-denied, success,
    first-run, or a screen's own, such as no-results. Leave out a state a screen cannot have.
  - Links: data-go="<screen>" or data-go="<screen>/<state>" opens it. A list repeats one <template
    data-item-template="<name>"> over a fixtures key, with data-field on each part it fills.
  - Components: data-component="<name>" on each reusable part, and data-variant="<variant>" for its variants.
  - Every control has a data-testid, in lowercase words joined by hyphens, and a name. Targets are 24 by 24 px or more.
  - Data: every word a screen shows comes from the fixtures block, as text. Use real copy, never filler.
  - Images: <img data-image="<field>" alt="..."> shows the image its fixture names: a data:image URI, or a file beside
    this design, such as people/mai.png. A path never leaves this design's folder.
  - Platforms and themes: the styles read :root[data-platform] (web, ios, android, desktop) and :root[data-theme]. On a
    phone, pad the chrome by max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)), and use 100dvh.
  - Deep links: #<screen>/<state>?theme=dark&frame=ios opens one view, and ?theme=dark or ?round=2 in the page's own
    query works too. A window under 768 px wide opens the iPhone frame when the link names none.
  - Screenshots: <screen>-<state>-<frame>-<theme>.png is the view #<screen>/<state>?theme=<theme>&frame=<frame>&zoom=actual.
    A direction of an exploration starts each name with its own, such as a-<screen>-<state>-<frame>-<theme>.png.
    Take each one once data-ready="true" shows on #workspace, or on #board for the Board, and never while the
    proto-link-problem banner says the link opened something else. A page lists the design's problems in proto-design-problems.
  - Comments: Add a comment pins a comment to an element, and a round's comments go beside this file as rounds/<N>/comments.json.
    In an exploration's directions/ folder, the round sits in the exploration's folder, and they go in its
    rounds/<N>/comments-<direction>.json, by this file's name, which takes letters, digits, and - only.
-->
<style>body { margin: 2rem auto; max-width: 62ch; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }</style>
</head>
<body>
<p>The design of <a href="{{spec_link}}" data-testid="proto-spec-link">{{spec}}</a>'s prototype: {{title}}. Open it in the prototype viewer with <code>aidd prototype {{path}}</code>, which shows every screen, state, and device. This file holds the design only, so it is the part Spec approval freezes.</p>
<template id="product">
<style id="tokens">
/* Generated from design/tokens.json by design/build.mjs: never edit by hand. */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --radius-control: 6px;
  --radius-surface: 12px;
  --size-target-min: 24px;
  --font-family-sans: Inter, system-ui, sans-serif;
  --font-weight-regular: 400;
  --font-weight-bold: 700;
  --font-size-body: 1rem;
  --font-size-heading: 1.5rem;
  --font-tracking-normal: 0px;
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --typography-body: 400 1rem/1.5 Inter, system-ui, sans-serif;
  --typography-heading: 700 1.5rem/1.25 Inter, system-ui, sans-serif;
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-base: 0ms;
  }
}
/* Generated from design/tokens.json by design/build.mjs: never edit by hand. */
:root,
:root[data-theme="light"] {
  --color-surface: #ffffff;
  --color-surface-raised: #f3f4f5;
  --color-text: #1c1e21;
  --color-text-muted: #5b616b;
  --color-accent: #1d4ed8;
  --color-accent-subtle: #dbe4ff;
  --color-danger: #b91c1c;
  --color-success: #067647;
  --color-warning: #8a4b00;
  --color-warning-subtle: #fff4cc;
  --color-focus: #1d4ed8;
  color-scheme: light;
}
/* Generated from design/tokens.json by design/build.mjs: never edit by hand. */
:root[data-theme="dark"] {
  --color-surface: #111317;
  --color-surface-raised: #1c1e21;
  --color-text: #f3f4f5;
  --color-text-muted: #9ea5b0;
  --color-accent: #93c5fd;
  --color-accent-subtle: #26345c;
  --color-danger: #fca5a5;
  --color-success: #47cd89;
  --color-warning: #fdb022;
  --color-warning-subtle: #3a3000;
  --color-focus: #93c5fd;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-surface: #111317;
    --color-surface-raised: #1c1e21;
    --color-text: #f3f4f5;
    --color-text-muted: #9ea5b0;
    --color-accent: #93c5fd;
    --color-accent-subtle: #26345c;
    --color-danger: #fca5a5;
    --color-success: #47cd89;
    --color-warning: #fdb022;
    --color-warning-subtle: #3a3000;
    --color-focus: #93c5fd;
    color-scheme: dark;
  }
}
</style>
<style id="styles">
  /* The product's styles: they reach only the frames. This start holds only the chrome and the screens' plumbing:
     the components come from your design system, so add their styles as you design them. They read the tokens with var(), by the build's names, and
     follow the frame's root element: data-platform (web, ios, android), data-theme, and data-mode. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; font: var(--typography-body); background: var(--color-surface); color: var(--color-text); container: frame / inline-size; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  button { font: inherit; color: inherit; }
  /* Product chrome. Web: header navigation beside the product name. iOS and Android: a top bar with the back
     affordance, and a tab bar at the bottom. */
  .device { display: grid; min-height: 100dvh; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; grid-template-areas: "brand nav" "bar bar" "main main"; }
  .brand { grid-area: brand; margin: 0; padding: var(--space-2) var(--space-3); background: var(--color-surface-raised); font-weight: 700; display: flex; align-items: center; }
  .tabs { grid-area: nav; display: flex; gap: var(--space-1); align-items: center; padding: var(--space-2) var(--space-3); background: var(--color-surface-raised); }
  .tabs button { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--size-target-min); padding: var(--space-1) var(--space-2); border: 0; border-radius: var(--radius-control); background: none; cursor: pointer; }
  .tabs button[aria-current="page"] { background: var(--color-accent-subtle); font-weight: 600; }
  .appbar { grid-area: bar; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-3) 0; min-width: 0; }
  .appbar h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; overflow-wrap: anywhere; }
  .back { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--size-target-min); padding: var(--space-1) var(--space-2) var(--space-1) 0; border: 0; background: none; color: var(--color-accent); cursor: pointer; max-width: 50%; }
  .back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  svg.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-android { display: none; }
  :root[data-platform="web"] .appbar { flex-wrap: wrap; }
  :root[data-platform="web"] .back { flex-basis: 100%; max-width: none; }
  :root:is([data-platform="ios"], [data-platform="android"]) .device { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; grid-template-areas: "bar" "main" "nav"; }
  :root:is([data-platform="ios"], [data-platform="android"]) .brand { display: none; }
  :root:is([data-platform="ios"], [data-platform="android"]) .appbar { background: var(--color-surface-raised); padding: calc(max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) + var(--space-2)) var(--space-3) var(--space-2); min-height: 44px; }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs { position: sticky; bottom: 0; justify-content: space-around; padding: var(--space-1) 0 calc(max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)) + var(--space-1)); border-top: 1px solid var(--color-text-muted); }
  :root:is([data-platform="ios"], [data-platform="android"]) .tabs button { flex-direction: column; gap: 2px; font-size: 0.75rem; min-width: 64px; }
  :root[data-platform="ios"] .appbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  :root[data-platform="ios"] .appbar .back { grid-column: 1; justify-self: start; max-width: 100%; }
  :root[data-platform="ios"] .appbar h1 { grid-column: 2; font-size: 1.0625rem; text-align: center; }
  :root[data-platform="ios"] .tabs button[aria-current="page"] { background: none; color: var(--color-accent); }
  :root[data-platform="android"] .appbar { min-height: 64px; }
  :root[data-platform="android"] .appbar h1 { font-size: 1.375rem; font-weight: 400; }
  :root[data-platform="android"] .back { min-width: 48px; min-height: 48px; justify-content: center; padding: 0; color: var(--color-text); }
  :root[data-platform="android"] .back span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  :root[data-platform="android"] .icon-ios { display: none; }
  :root[data-platform="android"] .icon-android { display: block; }
  :root[data-platform="android"] .tabs button[aria-current="page"] { background: none; }
  :root[data-platform="android"] .tabs button[aria-current="page"] svg { background: var(--color-accent-subtle); border-radius: 16px; width: 56px; padding: 2px 16px; box-sizing: content-box; }
  @container frame (max-width: 479px) {
    :root[data-platform="web"] .device { grid-template-columns: minmax(0, 1fr); grid-template-areas: "brand" "nav" "bar" "main"; grid-template-rows: auto auto auto 1fr; }
    :root[data-platform="web"] .tabs { padding-top: 0; }
  }
  /* Screens and their states: one of each shows at a time. */
  main { grid-area: main; padding: var(--space-3); min-width: 0; }
  main:focus, #screen-title:focus { outline: none; }
  section[data-screen], section[data-screen] > [data-state] { display: none; }
  section[data-screen].shown, section[data-screen] > [data-state].shown { display: block; }
  main :is(h2, h3) { margin: var(--space-3) 0 var(--space-2); line-height: 1.3; }
  main p { margin: 0 0 var(--space-3); max-width: 60ch; }
</style>
<div class="device">
  <p class="brand" data-text="product"></p>
  <nav class="tabs" aria-label="Main">
    <button type="button" data-go="start" data-component="tab" data-testid="app-tab-start"><span>Start</span></button>
  </nav>
  <div class="appbar" data-component="app-bar">
    <button type="button" class="back" data-back data-testid="app-back" hidden><svg class="icon icon-ios" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><svg class="icon icon-android" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12H4m6-6-6 6 6 6"/></svg><span id="back-label">Back</span></button>
    <h1 id="screen-title" tabindex="-1"></h1>
  </div>
  <main id="main" tabindex="-1">
    <section data-screen="start" data-title="Start" data-initial="success">
      <div data-state="success" data-testid="start-success">
        <h2>Replace this with the Spec's first screen</h2>
        <p>Add a section per screen, a state per case it can be in, and a data-component on each reusable part.</p>
      </div>
    </section>
  </main>
</div>
</template>
<script type="application/json" id="fixtures">
{
  "product": "Your product"
}
</script>
</body>
</html>
