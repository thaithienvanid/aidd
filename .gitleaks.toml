# gitleaks: the default rules, and two exceptions. Two deleted test files fed fake credentials to a redaction test,
# and older commits that hold them stay reachable from other branches (Dependabot's, until they are rebased), which
# the scan of the history reads. Each exception covers only those values, only in that file.
[extend]
useDefault = true

[[allowlists]]
description = "The fake credentials of a deleted redaction test, in older history"
condition = "AND"
paths = ['''^tests/test_robustness\.py$''']
regexes = ['''^(alice:s3cretpw|k3y-value)$''']

[[allowlists]]
description = "The fake key of a deleted redaction test, in older history"
condition = "AND"
paths = ['''^tests/test_prompt_and_compact_hooks\.py$''']
regexes = ['''^abcdEFGH1234$''']
