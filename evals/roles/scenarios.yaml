# Role evals. `aidd eval roles --agent-command "<agent cli>"` sends each role its agent file (playbook, loop contract,
# standards) plus a task with a seeded defect, and scores the answer by what it must mention, what it may
# not do, and whether it ends with the handoff note. A strong team is a number you can watch.
# Scoring is case-insensitive substring matching: `require` (all), `require_any` (one per group), `forbid` (none).
scenario:
  - id: r01-reviewer-planted-bug
    role: reviewer
    prompt: "Review this diff against its Spec. Report ranked findings with file, line, and failure scenario."
    fixture: "Spec SPEC-31, Acceptance: GET /items?page=N returns items (N-1)*20 to N*20-1; 20 per page; the first page is 1.\nTask T1 scope: src/items/paging.py\n\ndiff --git a/src/items/paging.py b/src/items/paging.py\n@@ -1,3 +1,3 @@\n def page_bounds(page, size=20):\n-    start = (page - 1) * size\n+    start = page * size\n     return start, start + size\ndiff --git a/src/items/format.py b/src/items/format.py\n@@ -1,2 +1,4 @@\n-def money(cents):\n-    return \"%d.%02d\" % divmod(cents, 100)\n+def money(cents: int) -> str:\n+    \"\"\"Format cents as dollars.\"\"\"\n+    return f\"{cents // 100}.{cents % 100:02d}\"\n"
    expected:
      require_any:
        - [off-by-one, page - 1, first page, skips, page 1]
        - [format.py, drive-by, outside the scope, unrelated, scope]
      require: [Done, Next, Needs, Stopped at, Spend]
  - id: r02-security-injection
    role: security-engineer
    prompt: "Security-review this diff before the human reviewer from the security pool. Report findings with severity, file, line, and the fix."
    fixture: "diff --git a/src/users/search.py b/src/users/search.py\n@@ -0,0 +1,3 @@\n+def find_users(db, name):\n+    query = f\"SELECT id, email FROM users WHERE name LIKE '%{name}%'\"\n+    return db.execute(query).fetchall()\n"
    expected:
      require_any:
        - [injection, parameteriz, placeholder, bind]
        - [critical, high]
      require: [Done, Next, Needs, Stopped at, Spend]
  - id: r03-verifier-red-first
    role: verifier
    prompt: "Write the tests for this Spec's Acceptance before any implementation exists. Return the test file, then say what happens when it runs on the current code."
    fixture: "Spec SPEC-52, type feat. Acceptance:\n  Given a cart whose items total $100.00, When coupon SAVE10 is applied, Then the total is $90.00.\n  Given coupon EXPIRED, When it is applied, Then the error is \"coupon expired\" and the total is unchanged.\ntests.files = [\"tests/cart/test_coupons.py\"]; Task T1 scope: src/cart/coupons.py (the file does not exist yet).\n"
    expected:
      require_any:
        - [def test_, it(, test(]
        - [fail, red, ImportError, ModuleNotFoundError]
      forbid: [def apply_coupon]
      require: [Done, Next, Needs, Stopped at, Spend]
  - id: r04-developer-surgical
    role: developer
    prompt: "Implement Task T1 of SPEC-44: `total()` must return 0 for an empty cart instead of raising. Return a unified diff and your handoff note."
    fixture: "src/cart/total.py (the Task's scope; the tests in tests/cart/test_total.py already fail on the empty cart):\n\ndef total(items):\n    return sum(i.price * i.qty for i in items) / len(items) * len(items)\n\n\ndef unused_helper(x):\n    return x  # TODO remove\n\n\ndef   format_total(t):\n    return \"$%.2f\"%t\n"
    expected:
      forbid: [-def unused_helper, -def   format_total, "+def format_total"]
      require_any:
        - [unused_helper]
        - [Done]
        - [Next]
      require: [Needs, Stopped at, Spend]
