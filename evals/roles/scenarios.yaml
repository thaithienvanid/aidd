# Role evals. `aidd eval roles --agent-command "<agent cli>"` sends each role its agent file (playbook, loop contract,
# standards) plus a task with a seeded defect, and scores what the role decided, not how it worded it. A strong team is a
# number you can watch.
# `step` is the loop step the case exercises, one of the role's `steps` in schemas/roles.json. The Coverage table in
# README.md counts the cases per role and step.
# `decisions` are the values the answer's one `Decision:` line may hold (the meanings are DECISION_MEANING in
# src/aidd/evals/suites.py), and `expected.decision` is the value, or values, that are right. A delegate case has no
# `decisions`; its `answer_is` reads the `delegate_answer` instead. Every answer also ends with the six-line handoff note,
# and the scorer reads it, unless the case says `handoff: false`: a right answer with no note then still passes. Only a case
# about the note (r01, r15, r71) or one with `note_any` keeps it required.
# `claim`, `tier`, and `proves` say what the case shows and when to run it (evals/README.md): the claim is `kind:name`,
# the tier is smoke, full, or held-out, and `proves` is one line. `evals/claims.json` lists the claims no case may lack.
# `shape` names the project shape the case shows, as type/stage/team/regulation from `evals/shapes.json`.
# Words only name a fact, and match whole words: `require_any` words the fixture does not hold, `names_any` words it does,
# `note_any` words in the note, `lines` a labelled line the prompt asks for, and `forbid` a word that must not appear.
# A diff is read by its lines and files: `changed_any`, `forbid_added`, `forbid_changed`, `edits_any`, `edits_all`,
# `forbid_edits`. src/aidd/evals/scoring.py defines each key.
scenario:
  - id: r01-reviewer-planted-bug
    claim: "duty:reviewer.finds-the-defect"
    tier: held-out
    shape: "api-service/brownfield/team/unregulated"
    proves: "The reviewer blocks a diff that breaks an Acceptance line and flags an unrequested rewrite."
    role: reviewer
    step: Review
    decisions: [block, pass]
    prompt: "Review this diff against its Spec. Report ranked findings with file, line, and failure scenario."
    fixture: "Spec SPEC-31, Acceptance: GET /items?page=N returns items (N-1)*20 to N*20-1; 20 per page; the first page is 1.\nTask T1 scope: src/items/paging.py\n\ndiff --git a/src/items/paging.py b/src/items/paging.py\n@@ -1,3 +1,3 @@\n def page_bounds(page, size=20):\n-    start = (page - 1) * size\n+    start = page * size\n     return start, start + size\ndiff --git a/src/items/format.py b/src/items/format.py\n@@ -1,2 +1,4 @@\n-def money(cents):\n-    return \"%d.%02d\" % divmod(cents, 100)\n+def money(cents: int) -> str:\n+    \"\"\"Format cents as dollars.\"\"\"\n+    return f\"{cents // 100}.{cents % 100:02d}\"\n"
    expected:
      decision: block
      require_any:
        - [off-by-one, off by one, "skip*", never served, first 20, opening 20, "20 to 39", drops, omits, misses the first]
        - [drive-by, unrelated, "rewrit*", "revert*", unrequested, unasked, beyond, separate change, own change, "split*", outside]
      names_any:
        - [src/items/paging.py, paging.py]
