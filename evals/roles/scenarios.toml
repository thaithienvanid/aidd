[[scenario]]
id = "r15-verifier-acceptance-mismatch"
role = "verifier"
prompt = "Verify the head of this PR against its Spec's Acceptance before Review. Here is what running it printed. Report what was run, what was seen, and each mismatch."
fixture = """
Spec SPEC-61, Acceptance:
  Given a title "Hello, World!", When `slug "Hello, World!"` runs, Then it prints "hello-world" and exits 0.
  Given an empty title, When `slug ""` runs, Then it prints "error: empty title" to stderr and exits 2.
`aidd test --spec specs/SPEC-61.md`: 4 passed (tests/test_slug.py covers only non-empty titles).

$ slug "Hello, World!"; echo "exit=$?"
hello-world
exit=0
$ slug ""; echo "exit=$?"

exit=0
"""
expected = { require_any = [["mismatch", "does not match", "not as specified", "fails"], ["exit 2", "exits 0", "exit code", "empty title"]], forbid = ["```diff", "+++ b/", "I fixed", "I have fixed"], require = ["Done", "Next", "Needs", "Stopped at"] }
