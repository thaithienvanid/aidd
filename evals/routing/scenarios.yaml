# Agent routing eval. `aidd eval routing --agent-command "<agent cli>"` sends each situation
# (with SKILL.md and references/routes.md) and scores the route. "stop" means no route may be chosen yet.
# `judgment` marks a scenario whose answer `aidd risk --paths` cannot compute from the paths alone: it measures
# the agent's reasoning, and the computed route may be lower. See README.md for running and recording scores.
# `paths`, `lines`, and `change_type` (never sent to the agent) let a unit test hold a label to the route
# `aidd risk --paths` computes from the areas in schemas/risks.json and from routes.md's size rule (a minor change past
# about 50 lines is normal), so a scenario cannot expect a route the rules would not give. A judgment case may expect a
# higher route than the rules compute, never a lower one. Each result also records the computed route.
# `expected.accept` lists every route the reference admits when it admits more than `route`, and `expected.reason_any`
# lists words the one-sentence reason must hold, for a case named for what it says (the readings it presents).
# `claim`, `tier`, and `proves` say what the case shows and when to run it (evals/README.md): the claim is `kind:name`,
# the tier is smoke, full, or held-out, and `proves` is one line. `evals/claims.json` lists the claims no case may lack.
# `shape` names the project shape the case shows, as type/stage/team/regulation from `evals/shapes.json`.
