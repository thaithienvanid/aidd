# Agent routing eval. `aidd eval routing --cmd "<agent cli>"` sends each situation
# (with SKILL.md and references/routes.md) and scores the route. "stop" means no route may be chosen yet.
# `judgment` marks a scenario whose answer the gate cannot compute from paths alone: it measures the
# agent's reasoning, and the gate's own minimum may be lower. See README.md for running and recording scores.
# `paths`, `lines`, and `type` (never sent to the agent) let a unit test hold a label to the gate's own
# computation (`evals.gate_route`, the library function behind `aidd assess --paths`), so a scenario cannot expect a route the
# rules would not require; each result also records that computed route as `gate`.

[[scenario]]
id = "c01-typo"
situation = "Fix a spelling mistake in docs/getting-started.md. One line changes."
paths = ["docs/getting-started.md"]
lines = 2
type = "docs"
expected = { route = "minor" }

