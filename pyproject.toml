[build-system]
requires = ["hatchling==1.32.4", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "aidd"
dynamic = ["version", "readme"]
description = "aidd is a governance layer for AI coding agents. Your agents do the work, and you decide the risky steps. aidd sizes each change, says when to ask, writes ask rules where agents have them, and ties each test run to its commit. It advises and enforces nothing: your harness and branch protection hold the stops. Local, no dependencies, no telemetry."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Van Hoang" }]
keywords = ["ai-governance", "human-in-the-loop", "spec-driven-development", "coding-agents", "agent-skills", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
# The runtime stays dependency-free: aidd executes inside an adopter's CI and on a person's machine, so a dependency there is
# a supply-chain edge in the most privileged place in the pipeline. jsonschema is test-only: tests/test_stock_validator.py checks the schemas and the conformance corpus
# with it when it is importable (CI's lint toolchain installs it) and skips when it is not. import-linter checks the
# module boundaries in .importlinter (tests/test_import_boundaries.py, the same way). The lower bounds match the
# versions CI pins in .github/requirements/lint.in.
dev = ["jsonschema>=4.26", "ruff>=0.17.1", "mypy>=2.4.0", "import-linter>=2.15"]

[project.scripts]
aidd = "aidd.cli:main"

[project.urls]
Homepage = "https://github.com/thaithienvanid/aidd"
Documentation = "https://github.com/thaithienvanid/aidd/blob/main/docs/METHOD.md"
Changelog = "https://github.com/thaithienvanid/aidd/blob/main/CHANGELOG.md"
Source = "https://github.com/thaithienvanid/aidd"
Issues = "https://github.com/thaithienvanid/aidd/issues"

[tool.hatch.version]
path = "src/aidd/__init__.py"

# The package's description is README.md with its relative links made absolute, so they resolve off GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/thaithienvanid/aidd/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/thaithienvanid/aidd/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://|data:)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/thaithienvanid/aidd/main/\1"'

# The data folders are mapped in as sources, not force-included: a force-include copies a folder verbatim, ignored
# files and all, so eval results or node_modules a maintainer made locally would ship. These honor .gitignore and
# the excludes (tests/test_release_surface.py). The CLI never reads schemas/editor/: an editor reads it from the release's
# URL, which the config's first line names (aidd.pyz.DEV_ONLY). The agent evals are in evals/, which no data folder holds.
[tool.hatch.build.targets.wheel]
only-include = ["src/aidd", "schemas", ".agents/skills/aidd", "templates", "plugins/aidd-team", "plugins/aidd-packs", "standards", "stacks"]
exclude = ["evals/results", "node_modules", "__pycache__", "schemas/editor"]

[tool.hatch.build.targets.wheel.sources]
"src/aidd" = "aidd"
"schemas" = "aidd/_data/schemas"
".agents/skills/aidd" = "aidd/_data/skill"
"templates" = "aidd/_data/templates"
"plugins/aidd-team" = "aidd/_data/team"
"plugins/aidd-packs" = "aidd/_data/packs"
"standards" = "aidd/_data/standards"
"stacks" = "aidd/_data/stacks"

# Every tracked file, so the sdist runs its own tests (weekly.yml's build job; tests/test_release_surface.py).
[tool.hatch.build.targets.sdist]
include = ["src/", "schemas/", ".agents/skills/aidd/", ".aidd/", ".importlinter", "templates/", "tests/", "evals/", "docs/",
           ".github/", "tools/", "action.yml", "install.sh", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "AGENTS.md",
           "RELEASING.md", "GOVERNANCE.md", "REVIEW.md", "llms-install.md", "llms.txt", "scripts/", ".claude-plugin/", "plugins/", "specs/", "standards/", "stacks/", ".gitattributes", ".gitleaks.toml", ".codex/", ".opencode/", "opencode.json", ".claude/settings.json"]
# The aidd-cli plugin's folder links (tests/test_cli_plugin.py), pruned before the walk enters them: hatchling follows
# links and keeps the first path it reaches to each folder, so a link it entered could take the real folder's place.
exclude = ["plugins/aidd-cli/src", "plugins/aidd-cli/schemas", "plugins/aidd-cli/templates", "plugins/aidd-cli/standards", "plugins/aidd-cli/stacks",
           "plugins/aidd-cli/.agents", "plugins/aidd-cli/plugins"]
skip-excluded-dirs = true

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1514", "TID252"]
ignore = ["E501"]
# PLW1514 (text I/O without an explicit encoding) is a preview rule; explicit-preview-rules keeps every other
# selected rule on its stable behavior. Without an encoding, a read or write follows the locale (cp1252 on Windows).
preview = true
explicit-preview-rules = true

[tool.mypy]
python_version = "3.11"
files = ["src/aidd", "plugins/aidd-team/tools"]
check_untyped_defs = true
warn_unused_ignores = true

# Absolute imports only (`from aidd.kernel import git`): a module that moves keeps its own imports, and grep finds every
# importer of a module (CONTRIBUTING, "Code and imports").
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests import helpers first: it puts src/ on sys.path before `aidd` is imported.
"tests/*" = ["I"]
